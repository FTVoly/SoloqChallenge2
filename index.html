    {
        "imports": {

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        
        body {

</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Trophy, Swords, Flame, ShieldAlert, Award, Clock, Users, 
            ExternalLink, Settings, UserPlus, Edit2, Check, X, Lock, 
            Twitch, Gamepad2, ArrowUpRight, ChevronRight, Sparkles 
        } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyBwNrlXY81VOXtp2EGyFb_k3OWHKbtcY2o",
            authDomain: "soloq-challenge-5a13b.firebaseapp.com",
            projectId: "soloq-challenge-5a13b",
            storageBucket: "soloq-challenge-5a13b.firebasestorage.app",
            messagingSenderId: "206777469457",
            appId: "1:206777469457:web:5945045a4d26f2c04cbfb0",
            measurementId: "G-GZEVTXYQVP"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error(e);
        }

        const RANKS = ['Unranked', 'Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Emerald', 'Diamond', 'Master', 'Grandmaster', 'Challenger'];

        const TIER_VALUES = {
            'IRON': 0, 'BRONZE': 400, 'SILVER': 800, 'GOLD': 1200, 'PLATINUM': 1600,
            'EMERALD': 2000, 'DIAMOND': 2400, 'MASTER': 2800, 'GRANDMASTER': 2800, 'CHALLENGER': 2800
        };
        const RANK_VALUES = { 'IV': 0, 'III': 100, 'II': 200, 'I': 300 };

        const calculateAbsoluteLP = (tier, rank, lp) => {
            const tierVal = TIER_VALUES[tier.toUpperCase()] || 0;
            const rankVal = (['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(tier.toUpperCase())) ? 0 : (RANK_VALUES[rank.toUpperCase()] || 0);
            return tierVal + rankVal + Number(lp);
        };

        const calculateWR = (wins, losses) => {
            const total = wins + losses;
            return total === 0 ? 0 : Math.round((wins / total) * 100);
        };

        const RankBadge = ({ rank = 'Unranked' }) => {
            const colors = {
                Challenger: 'bg-amber-400/10 text-amber-300 border-amber-400/40',
                Grandmaster: 'bg-red-500/10 text-red-400 border-red-500/40',
                Master: 'bg-purple-500/10 text-purple-300 border-purple-500/40',
                Diamond: 'bg-blue-400/10 text-blue-300 border-blue-400/40',
                Emerald: 'bg-emerald-400/10 text-emerald-300 border-emerald-400/40',
                Platinum: 'bg-teal-400/10 text-teal-300 border-teal-400/40',
                Gold: 'bg-yellow-500/10 text-yellow-300 border-yellow-500/40',
                Silver: 'bg-slate-300/10 text-slate-300 border-slate-300/40',
                Bronze: 'bg-amber-700/10 text-amber-500 border-amber-700/40',
                Iron: 'bg-zinc-500/10 text-zinc-400 border-zinc-500/40',
                Unranked: 'bg-slate-800 text-slate-500 border-slate-700'
            };
            const style = colors[rank] || colors['Unranked'];
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider border ${style}`}>
                    {rank}
                </span>
            );
        };

        const Countdown = ({ targetDate }) => {
            const [timeLeft, setTimeLeft] = useState({ j: 0, h: 0, m: 0, s: 0 });

            useEffect(() => {
                if (!targetDate) return;
                const update = () => {
                    const diff = new Date(targetDate).getTime() - new Date().getTime();
                    if (diff <= 0) {
                        setTimeLeft({ j: 0, h: 0, m: 0, s: 0 });
                        return;
                    }
                    setTimeLeft({
                        j: Math.floor(diff / (1000 * 60 * 60 * 24)),
                        h: Math.floor((diff / (1000 * 60 * 60)) % 24),
                        m: Math.floor((diff / (1000 * 60)) % 60),
                        s: Math.floor((diff / 1000) % 60)
                    });
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

            return (
                <div className="flex gap-2 text-center">
                    {[
                        { label: 'J', val: timeLeft.j },
                        { label: 'H', val: timeLeft.h },
                        { label: 'M', val: timeLeft.m },
                        { label: 'S', val: timeLeft.s }
                    ].map((item, idx) => (
                        <div key={idx} className="bg-slate-900/80 border border-slate-800 rounded-lg px-2.5 py-1.5 min-w-[42px]">
                            <div className="text-lg font-bold font-heading text-purple-400 leading-tight">{String(item.val).padStart(2, '0')}</div>
                            <div className="text-[10px] text-slate-500 font-semibold">{item.label}</div>
                        </div>
                    ))}
                </div>
            );
        };

        const Podium = ({ top3 }) => {
            if (!top3 || top3.length === 0) return null;
            const [first, second, third] = top3;

            const renderCard = (player, place, glowClass, crownColor) => {
                if (!player) return null;
                const wr = calculateWR(player.wins || 0, player.losses || 0);
                return (
                    <div className={`relative bg-gradient-to-b from-[#161c28] to-[#0f131c] rounded-2xl p-5 border flex flex-col items-center ${glowClass} transition-transform hover:-translate-y-1`}>
                        <div className={`absolute -top-3.5 px-3 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider flex items-center gap-1 ${crownColor}`}>
                            <Trophy size={13} /> {place}
                        </div>
                        <div className="relative mt-3 mb-3">
                            <img 
                                src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                alt={player.playerName}
                                className="w-20 h-20 rounded-full object-cover border-2 border-slate-700 shadow-lg"
                            />
                            <div className="absolute -bottom-1 -right-1">
                                <RankBadge rank={player.rank} />
                            </div>
                        </div>
                        <h4 className="font-heading text-xl font-bold text-white tracking-wide">{player.playerName}</h4>
                        <span className="text-xs font-mono text-slate-400 mb-3">{player.riotId}</span>
                        <div className="text-2xl font-black font-heading text-yellow-400 mb-2">
                            {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} <span className="text-sm font-semibold text-slate-400">LP</span>
                        </div>
                        <div className="w-full pt-3 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                            <span>{player.wins || 0}V - {player.losses || 0}D</span>
                            <span className={wr >= 50 ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>{wr}% WR</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 items-end">
                    <div className="order-2 md:order-1">{renderCard(second, '2e place', 'silver-glow border-slate-500/40', 'bg-slate-300 text-slate-950')}</div>
                    <div className="order-1 md:order-2 -mt-4">{renderCard(first, '1ère place', 'gold-glow border-yellow-500/50 scale-105', 'bg-yellow-400 text-yellow-950 shadow-lg')}</div>
                    <div className="order-3 md:order-3">{renderCard(third, '3e place', 'bronze-glow border-amber-700/40', 'bg-amber-600 text-white')}</div>
                </div>
            );
        };

        const Leaderboard = ({ players, onUpdatePlayer, isAdmin, onRequestDelete }) => {
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({});
            const [search, setSearch] = useState('');

            const sorted = useMemo(() => {
                return [...players].sort((a, b) => (b.lpDelta || 0) - (a.lpDelta || 0));
            }, [players]);

            const filtered = useMemo(() => {
                return sorted.filter(p => 
                    p.playerName.toLowerCase().includes(search.toLowerCase()) || 
                    p.riotId.toLowerCase().includes(search.toLowerCase())
                );
            }, [sorted, search]);

            const top3 = sorted.slice(0, 3);

            return (
                <div className="space-y-6">
                    <Podium top3={top3} />

                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                                <Flame className="text-orange-500" /> Classement en direct
                            </h2>
                            <p className="text-xs text-slate-400 mt-0.5">Trié selon la progression absolue en LP depuis le coup d'envoi.</p>
                        </div>
                        <input 
                            type="text" 
                            placeholder="Rechercher un streamer / joueur..." 
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                            className="bg-[#121722] border border-slate-700/70 rounded-xl px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 w-full sm:w-64"
                        />
                    </div>

                    <div className="bg-[#10141d]/90 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden backdrop-blur-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[760px]">
                                <thead>
                                    <tr className="bg-[#0b0e15] text-[11px] font-heading uppercase text-slate-400 border-b border-slate-800 tracking-wider">
                                        <th className="py-4 px-4 text-center w-14">#</th>
                                        <th className="py-4 px-4">Participant</th>
                                        <th className="py-4 px-4">Rang actuel</th>
                                        <th className="py-4 px-4 text-center">Score SoloQ</th>
                                        <th className="py-4 px-4 text-center">Winrate</th>
                                        <th className="py-4 px-4 text-center">Bilan V / D</th>
                                        {isAdmin && <th className="py-4 px-4 text-center w-20">Admin</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60 text-sm">
                                    {filtered.length === 0 && (
                                        <tr><td colSpan="7" className="py-12 text-center text-slate-500 italic">Aucun participant ne correspond à la recherche.</td></tr>
                                    )}
                                    {filtered.map((player, idx) => {
                                        const rankIndex = sorted.findIndex(p => p.id === player.id);
                                        const wr = calculateWR(player.wins || 0, player.losses || 0);
                                        const isEditing = editingId === player.id;

                                        return (
                                            <tr key={player.id} className="hover:bg-slate-800/30 transition-colors">
                                                <td className="py-3.5 px-4 text-center font-heading font-bold text-base">
                                                    {rankIndex === 0 ? <span className="text-yellow-400">1</span> :
                                                     rankIndex === 1 ? <span className="text-slate-300">2</span> :
                                                     rankIndex === 2 ? <span className="text-amber-600">3</span> :
                                                     <span className="text-slate-500">{rankIndex + 1}</span>}
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="flex items-center gap-3">
                                                        <img 
                                                            src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                            className="w-10 h-10 rounded-full object-cover border border-slate-700" 
                                                            alt=""
                                                        />
                                                        <div>
                                                            <div className="font-bold text-slate-100 flex items-center gap-2">
                                                                {player.playerName}
                                                                {player.twitchUrl && (
                                                                    <a href={player.twitchUrl} target="_blank" rel="noreferrer" className="text-purple-400 hover:text-purple-300">
                                                                        <Twitch size={13} />
                                                                    </a>
                                                                )}
                                                            </div>
                                                            <div className="text-xs font-mono text-slate-400">{player.riotId}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <RankBadge rank={player.rank} />
                                                </td>
                                                <td className="py-3.5 px-4 text-center">
                                                    <span className={`font-heading font-bold text-lg ${player.lpDelta >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                                                        {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="max-w-[120px] mx-auto text-center">
                                                        <span className={`text-xs font-bold ${wr >= 50 ? 'text-emerald-400' : 'text-red-400'}`}>{wr}%</span>
                                                        <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-1">
                                                            <div className={`h-full ${wr >= 50 ? 'bg-emerald-500' : 'bg-red-500'}`} style={{ width: `${wr}%` }}></div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4 text-center font-medium text-xs">
                                                    <span className="text-emerald-400 font-bold">{player.wins || 0}V</span>
                                                    <span className="text-slate-600 mx-1.5">/</span>
                                                    <span className="text-red-400 font-bold">{player.losses || 0}D</span>
                                                </td>
                                                {isAdmin && (
                                                    <td className="py-3.5 px-4 text-center">
                                                        <div className="flex justify-center gap-1">
                                                            <button onClick={() => onRequestDelete(player)} className="p-1.5 text-slate-500 hover:text-red-400 transition">
                                                                <X size={15} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayersList = ({ players }) => {
            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                            <Users className="text-purple-400" /> Les Participants ({players.length})
                        </h2>
                        <p className="text-xs text-slate-400 mt-0.5">Accède directement aux profils OP.GG et aux chaînes Twitch officielles.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {players.map(player => {
                            const wr = calculateWR(player.wins || 0, player.losses || 0);
                            return (
                                <div key={player.id} className="bg-[#111622] border border-slate-800 rounded-2xl p-5 hover:border-purple-500/40 transition-all flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex items-center gap-3">
                                                <img 
                                                    src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                    alt="" 
                                                    className="w-14 h-14 rounded-full object-cover border-2 border-slate-700"
                                                />
                                                <div>
                                                    <h3 className="font-heading text-xl font-bold text-white">{player.playerName}</h3>
                                                    <span className="text-xs font-mono text-slate-400">{player.riotId}</span>
                                                </div>
                                            </div>
                                            <RankBadge rank={player.rank} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 bg-[#0b0e15] p-3 rounded-xl border border-slate-800/80 mb-4 text-center">
                                            <div>
                                                <div className="text-[10px] text-slate-500 uppercase font-heading">Progression</div>
                                                <div className="font-heading text-lg font-bold text-yellow-400">
                                                    {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] text-slate-500 uppercase font-heading">Ratio V/D</div>
                                                <div className="font-heading text-lg font-bold text-slate-200">
                                                    {player.wins || 0}W <span className="text-xs text-slate-500 font-normal">/</span> {player.losses || 0}L
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <a 
                                            href={`https://www.op.gg/summoners/euw/${encodeURIComponent(player.riotId.replace('#', '-'))}`} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            className="flex-1 bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl py-2 px-3 text-xs font-bold font-heading flex items-center justify-center gap-1.5 transition"
                                        >
                                            <Gamepad2 size={14} /> OP.GG
                                        </a>
                                        {player.twitchUrl && (
                                            <a 
                                                href={player.twitchUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="flex-1 bg-purple-600/10 hover:bg-purple-600/20 text-purple-300 border border-purple-500/30 rounded-xl py-2 px-3 text-xs font-bold font-heading flex items-center justify-center gap-1.5 transition"
                                            >
                                                <Twitch size={14} /> Twitch
                                            </a>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const RulesView = ({ config }) => {
            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-black font-heading text-white tracking-wide">Règlement officiel</h2>
                        <p className="text-slate-400 text-sm mt-1">Modalités, conditions de victoire et dotations du tournoi.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-[#111622] p-6 rounded-2xl border border-slate-800">
                            <h3 className="font-heading text-lg font-bold text-purple-400 flex items-center gap-2 mb-3">
                                <Award size={18} /> Règles de la course
                            </h3>
                            <div className="text-slate-300 text-sm whitespace-pre-wrap leading-relaxed">
                                {config?.rulesText || "1. SoloQ uniquement en file classée 5v5.\n2. Le vainqueur est celui ayant cumulé le plus de LP nets.\n3. Fair-play obligatoire, tout comportement sanctionné par Riot entraîne la disqualification."}
                            </div>
                        </div>

                        <div className="bg-[#111622] p-6 rounded-2xl border border-slate-800">
                            <h3 className="font-heading text-lg font-bold text-yellow-400 flex items-center gap-2 mb-3">
                                <Trophy size={18} /> Récompenses & Gages
                            </h3>
                            <div className="text-slate-300 text-sm whitespace-pre-wrap leading-relaxed">
                                {config?.prizesText || "🏆 Vainqueur : Cashprize & Gloire éternelle\n🥈 2ème place : Dotation Riot Points\n💀 Dernier : Gage imposé en live par la commu !"}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ players, onAddPlayer, onUpdatePlayer }) => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('riotApiKey') || '');
            const [status, setStatus] = useState('');
            const [loading, setLoading] = useState(false);
            const [playerForm, setPlayerForm] = useState({ playerName: '', riotId: '', twitchUrl: '' });

            const handleSync = async () => {
                if (!apiKey.trim()) return setStatus("❌ Clé API Riot requise.");
                setLoading(true);
                setStatus("⏳ Synchronisation des invocateurs via le proxy Vercel...");
                let success = 0, errors = [];

                for (const p of players) {
                    try {
                        const [gameName, tagLine] = p.riotId.split('#');
                        const accRes = await fetch(`/api/riot?type=account&gameName=${encodeURIComponent(gameName.trim())}&tagLine=${encodeURIComponent(tagLine.trim())}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const accData = await accRes.json();
                        if (!accRes.ok) throw new Error(accData.error || `Erreur Account (${accRes.status})`);

                        const sumRes = await fetch(`/api/riot?type=summoner&value=${accData.puuid}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const sumData = await sumRes.json();
                        if (!sumRes.ok) throw new Error(sumData.error || `Erreur Summoner (${sumRes.status})`);

                        const legRes = await fetch(`/api/riot?type=league&value=${accData.puuid}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const legData = await legRes.json();
                        if (!legRes.ok) throw new Error(legData.error || `Erreur League (${legRes.status})`);

                        const soloQ = Array.isArray(legData) ? legData.find(q => q.queueType === 'RANKED_SOLO_5x5') : null;
                        let rankStr = 'Unranked', wins = 0, losses = 0, currentAbsLP = 0;
                        const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${sumData.profileIconId}.jpg`;

                        if (soloQ) {
                            rankStr = soloQ.tier.charAt(0).toUpperCase() + soloQ.tier.slice(1).toLowerCase();
                            wins = soloQ.wins;
                            losses = soloQ.losses;
                            currentAbsLP = calculateAbsoluteLP(soloQ.tier, soloQ.rank, soloQ.leaguePoints);
                        }

                        let startLP = p.startAbsoluteLP ?? currentAbsLP;

                        await onUpdatePlayer(p.id, {
                            rank: rankStr,
                            wins,
                            losses,
                            profileImg: iconUrl,
                            startAbsoluteLP: startLP,
                            currentAbsoluteLP: currentAbsLP,
                            lpDelta: currentAbsLP - startLP
                        });
                        success++;
                        await new Promise(r => setTimeout(r, 200));
                    } catch (err) {
                        errors.push(`${p.playerName} : ${err.message}`);
                    }
                }
                setStatus(errors.length ? `⚠️ ${success} mis à jour, erreurs :\n${errors.join('\n')}` : `✅ ${success} joueur(s) synchronisés avec succès.`);
                setLoading(false);
            };

            const submitPlayer = async (e) => {
                e.preventDefault();
                await onAddPlayer({ ...playerForm, rank: 'Unranked', lpDelta: 0, wins: 0, losses: 0 });
                setPlayerForm({ playerName: '', riotId: '', twitchUrl: '' });
            };

            return (
                <div className="max-w-3xl mx-auto space-y-8">
                    <div className="bg-[#111622] p-6 rounded-2xl border border-purple-500/30">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-4">
                            <Settings className="text-purple-400" /> Riot API Tracker
                        </h3>
                        <div className="flex gap-3 mb-4">
                            <input 
                                type="password" 
                                placeholder="RGAPI-XXXXXXXX-XXXX-..." 
                                value={apiKey} 
                                onChange={e => { setApiKey(e.target.value); localStorage.setItem('riotApiKey', e.target.value); }}
                                className="flex-1 bg-[#0b0e15] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                            <button 
                                onClick={handleSync} 
                                disabled={loading}
                                className="bg-purple-600 hover:bg-purple-500 text-white font-heading font-bold px-6 py-2.5 rounded-xl transition disabled:opacity-50"
                            >
                                {loading ? 'Sync...' : 'Synchroniser'}
                            </button>
                        </div>
                        {status && <pre className="p-3 bg-black/40 rounded-lg text-xs font-mono text-slate-300 whitespace-pre-wrap">{status}</pre>}
                    </div>

                    <form onSubmit={submitPlayer} className="bg-[#111622] p-6 rounded-2xl border border-slate-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-4">
                            <UserPlus className="text-emerald-400" /> Inscrire un compétiteur
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                            <input 
                                required 
                                placeholder="Pseudo streamer" 
                                value={playerForm.playerName}
                                onChange={e => setPlayerForm({...playerForm, playerName: e.target.value})}
                                className="bg-[#0b0e15] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                            <input 
                                required 
                                placeholder="Riot ID (Nom#TAG)" 
                                value={playerForm.riotId}
                                onChange={e => setPlayerForm({...playerForm, riotId: e.target.value})}
                                className="bg-[#0b0e15] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                            <input 
                                placeholder="URL Twitch (optionnel)" 
                                value={playerForm.twitchUrl}
                                onChange={e => setPlayerForm({...playerForm, twitchUrl: e.target.value})}
                                className="bg-[#0b0e15] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                        </div>
                        <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-heading font-bold py-2.5 rounded-xl transition">
                            Ajouter au challenge
                        </button>
                    </form>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [tab, setTab] = useState('classement');
            const [players, setPlayers] = useState([]);
            const [config, setConfig] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwd, setPwd] = useState('');
            const [toDelete, setToDelete] = useState(null);

            useEffect(() => {
                if (!auth) return;
                signInAnonymously(auth).catch(err => console.error(err));
                onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const unsubP = onSnapshot(collection(db, 'players'), snap => {
                    setPlayers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubC = onSnapshot(doc(db, 'config', 'main'), snap => {
                    if (snap.exists()) setConfig(snap.data());
                });
                return () => { unsubP(); unsubC(); };
            }, [user]);

            const crud = {
                add: async data => addDoc(collection(db, 'players'), data),
                update: async (id, data) => updateDoc(doc(db, 'players', id), data),
                del: async id => deleteDoc(doc(db, 'players', id)),
                updateConfig: async data => setDoc(doc(db, 'config', 'main'), data, { merge: true })
            };

            const stats = useMemo(() => {
                const totalGames = players.reduce((acc, p) => acc + (p.wins || 0) + (p.losses || 0), 0);
                return { totalGames, count: players.length };
            }, [players]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header soloqchallenge.fr style */}
                    <header className="border-b border-slate-800/80 bg-[#0c1017]/90 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center font-heading font-black text-white text-lg shadow-md">
                                        SQ
                                    </div>
                                    <span className="font-heading font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-yellow-400">
                                        SOLOQ CHALLENGE
                                    </span>
                                </div>
                                <div className="hidden lg:flex items-center gap-4 text-xs font-heading uppercase text-slate-400 pl-6 border-l border-slate-800">
                                    <div>Participants : <span className="text-white font-bold">{stats.count}</span></div>
                                    <div>Parties jouées : <span className="text-purple-400 font-bold">{stats.totalGames}</span></div>
                                </div>
                            </div>

                            <nav className="flex items-center gap-1.5 bg-[#121722] p-1 rounded-xl border border-slate-800">
                                <button onClick={() => setTab('classement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'classement' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}>Classement</button>
                                <button onClick={() => setTab('joueurs')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'joueurs' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}>Joueurs</button>
                                <button onClick={() => setTab('reglement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'reglement' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}>Règles</button>
                                {isAdmin && <button onClick={() => setTab('admin')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'admin' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white'}`}>Admin</button>}
                                
                                <div className="w-px h-4 bg-slate-700 mx-1"></div>
                                {isAdmin ? (
                                    <button onClick={() => setIsAdmin(false)} className="px-2 py-1 text-red-400 text-xs font-heading font-bold">Quitter</button>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="p-1.5 text-slate-500 hover:text-white transition"><Lock size={14}/></button>
                                )}
                            </nav>
                        </div>
                    </header>

                    {/* Main content */}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {tab === 'classement' && <Leaderboard players={players} onUpdatePlayer={crud.update} isAdmin={isAdmin} onRequestDelete={setToDelete} />}
                        {tab === 'joueurs' && <PlayersList players={players} />}
                        {tab === 'reglement' && <RulesView config={config} />}
                        {tab === 'admin' && isAdmin && <AdminPanel players={players} onAddPlayer={crud.add} onUpdatePlayer={crud.update} />}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800/80 bg-[#090c12] py-6 text-center text-xs text-slate-500">
                        SoloQ Challenge — Plateforme non affiliée à Riot Games. Données synchronisées via l'API Riot Games.
                    </footer>

                    {/* Admin Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-[#111622] p-6 rounded-2xl w-full max-w-sm border border-slate-700 shadow-2xl">
                                <div className="flex justify-between mb-4">
                                    <h3 className="font-heading font-bold text-lg text-white">Accès Organisateur</h3>
                                    <button onClick={() => setShowLogin(false)} className="text-slate-400"><X size={18}/></button>
                                </div>
                                <input 
                                    type="password" 
                                    value={pwd} 
                                    onChange={e => setPwd(e.target.value)} 
                                    placeholder="Mot de passe admin" 
                                    className="w-full bg-[#0b0e15] border border-slate-700 rounded-xl px-4 py-2.5 mb-4 text-white text-sm"
                                />
                                <button 
                                    onClick={() => { if (pwd === 'Hussein180690') { setIsAdmin(true); setShowLogin(false); setPwd(''); } }} 
                                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-heading font-bold py-2.5 rounded-xl transition"
                                >
                                    Déverrouiller
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Delete Modal */}
                    {toDelete && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-[#111622] p-6 rounded-2xl w-full max-w-sm border border-slate-700 text-center">
                                <h3 className="font-heading font-bold text-lg text-white mb-2">Retirer {toDelete.playerName} ?</h3>
                                <p className="text-xs text-slate-400 mb-6">Cette action est définitive et supprimera ses stats du classement.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setToDelete(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-heading font-bold py-2 rounded-xl text-sm">Annuler</button>
                                    <button onClick={() => { crud.del(toDelete.id); setToDelete(null); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-heading font-bold py-2 rounded-xl text-sm">Supprimer</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
