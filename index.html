<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloQ Challenge — Leaderboard Officiel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel pour le JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            background: #0a0a0b;
            color: #e4e4e7; 
            font-family: 'Inter', sans-serif; 
        }
        
        h1, h2, h3, .font-heading {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

            </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Trophy, Swords, Flame, ShieldAlert, Award, Clock, Users, 
            ExternalLink, Settings, UserPlus, Edit2, Check, X, Lock, 
            Twitch, Gamepad2, ArrowUpRight, ChevronRight, Sparkles,
            RotateCcw, History, Shield
        } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, query, orderBy, limit, writeBatch, getDocs } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyBwNrlXY81VOXtp2EGyFb_k3OWHKbtcY2o",
            authDomain: "soloq-challenge-5a13b.firebaseapp.com",
            projectId: "soloq-challenge-5a13b",
            storageBucket: "soloq-challenge-5a13b.firebasestorage.app",
            messagingSenderId: "206777469457",
            appId: "1:206777469457:web:5945045a4d26f2c04cbfb0",
            measurementId: "G-GZEVTXYQVP"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error(e);
        }

        const RANKS = ['Unranked', 'Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Emerald', 'Diamond', 'Master', 'Grandmaster', 'Challenger'];

        const TIER_VALUES = {
            'IRON': 0, 'BRONZE': 400, 'SILVER': 800, 'GOLD': 1200, 'PLATINUM': 1600,
            'EMERALD': 2000, 'DIAMOND': 2400, 'MASTER': 2800, 'GRANDMASTER': 2800, 'CHALLENGER': 2800
        };
        const RANK_VALUES = { 'IV': 0, 'III': 100, 'II': 200, 'I': 300 };

        const calculateAbsoluteLP = (tier, rank, lp) => {
            const tierVal = TIER_VALUES[tier.toUpperCase()] || 0;
            const rankVal = (['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(tier.toUpperCase())) ? 0 : (RANK_VALUES[rank.toUpperCase()] || 0);
            return tierVal + rankVal + Number(lp);
        };

        const calculateWR = (wins, losses) => {
            const total = wins + losses;
            return total === 0 ? 0 : Math.round((wins / total) * 100);
        };

        const DEFAULT_ICON = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg';

        const TEAMS = {
            rouge: { label: 'Équipe Rouge', short: 'Rouge', dot: 'bg-red-500', text: 'text-red-400', border: 'border-red-500/40', bg: 'bg-red-500/10', bar: 'bg-red-500', glow: 'shadow-none' },
            bleu:  { label: 'Équipe Bleue', short: 'Bleu',  dot: 'bg-blue-500', text: 'text-blue-400', border: 'border-blue-500/40', bg: 'bg-blue-500/10', bar: 'bg-blue-500', glow: 'shadow-none' }
        };

        const formatLP = (v) => {
            const n = Number(v) || 0;
            return n > 0 ? `+${n}` : `${n}`;
        };

        const formatDate = (ts) => {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        };

        const TeamTag = ({ team }) => {
            const t = TEAMS[team];
            if (!t) return null;
            return (
                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold font-heading uppercase tracking-wider border ${t.bg} ${t.text} ${t.border}`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${t.dot}`}></span>{t.short}
                </span>
            );
        };

        // Compteur global par équipe (somme des LP gagnés/perdus + bilan V/D)
        const TeamScoreboard = ({ players }) => {
            const totals = useMemo(() => {
                const base = () => ({ lp: 0, wins: 0, losses: 0, count: 0 });
                const res = { rouge: base(), bleu: base() };
                players.forEach(p => {
                    if (!res[p.team]) return;
                    res[p.team].lp += Number(p.lpDelta) || 0;
                    res[p.team].wins += Number(p.wins) || 0;
                    res[p.team].losses += Number(p.losses) || 0;
                    res[p.team].count += 1;
                });
                return res;
            }, [players]);

            if (totals.rouge.count === 0 && totals.bleu.count === 0) return null;

            const r = totals.rouge.lp, b = totals.bleu.lp;
            // Barre de domination : basée sur l'écart, centrée à 50 %
            const span = Math.max(Math.abs(r), Math.abs(b), 1);
            const redShare = Math.min(95, Math.max(5, 50 + ((r - b) / (2 * span)) * 50));
            const leader = r === b ? null : (r > b ? 'rouge' : 'bleu');

            const side = (key) => {
                const t = TEAMS[key], s = totals[key];
                const wr = calculateWR(s.wins, s.losses);
                return (
                    <div className={`flex-1 rounded-2xl border p-5 bg-zinc-900/60 ${t.border} ${leader === key ? t.glow : ''} ${key === 'bleu' ? 'text-right' : ''}`}>
                        <div className={`flex items-center gap-2 font-heading font-bold uppercase tracking-wider text-sm ${t.text} ${key === 'bleu' ? 'justify-end' : ''}`}>
                            <Shield size={15} /> {t.label}
                            {leader === key && <Trophy size={14} className="text-zinc-100" />}
                        </div>
                        <div className={`font-heading font-black text-4xl mt-1 ${s.lp >= 0 ? 'text-white' : 'text-red-300'}`}>
                            {formatLP(s.lp)} <span className="text-base font-semibold text-zinc-400">LP</span>
                        </div>
                        <div className="text-xs text-zinc-400 mt-1">
                            {s.count} joueur{s.count > 1 ? 's' : ''} · {s.wins}V / {s.losses}D · <span className={wr >= 50 ? 'text-emerald-400' : 'text-red-400'}>{wr}% WR</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="mb-10">
                    <div className="flex flex-col sm:flex-row gap-3 items-stretch">
                        {side('rouge')}
                        <div className="flex items-center justify-center font-heading font-black text-zinc-500 text-xl px-2">
                            <Swords size={22} />
                        </div>
                        {side('bleu')}
                    </div>
                    <div className="mt-3 h-2 rounded-full overflow-hidden flex bg-zinc-800">
                        <div className={`${TEAMS.rouge.bar} transition-all duration-700`} style={{ width: `${redShare}%` }}></div>
                        <div className={`${TEAMS.bleu.bar} transition-all duration-700`} style={{ width: `${100 - redShare}%` }}></div>
                    </div>
                </div>
            );
        };

        const RankBadge = ({ rank = 'Unranked' }) => {
            const colors = {
                Challenger: 'bg-amber-400/10 text-amber-300 border-amber-400/40',
                Grandmaster: 'bg-red-500/10 text-red-400 border-red-500/40',
                Master: 'bg-purple-500/10 text-purple-300 border-purple-500/40',
                Diamond: 'bg-blue-400/10 text-blue-300 border-blue-400/40',
                Emerald: 'bg-emerald-400/10 text-emerald-300 border-emerald-400/40',
                Platinum: 'bg-teal-400/10 text-teal-300 border-teal-400/40',
                Gold: 'bg-yellow-500/10 text-yellow-300 border-yellow-500/40',
                Silver: 'bg-zinc-300/10 text-zinc-300 border-zinc-300/40',
                Bronze: 'bg-amber-700/10 text-amber-500 border-amber-700/40',
                Iron: 'bg-zinc-500/10 text-zinc-400 border-zinc-500/40',
                Unranked: 'bg-zinc-800 text-zinc-500 border-zinc-700'
            };
            const style = colors[rank] || colors['Unranked'];
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider border ${style}`}>
                    {rank}
                </span>
            );
        };

        const Countdown = ({ targetDate }) => {
            const [timeLeft, setTimeLeft] = useState({ j: 0, h: 0, m: 0, s: 0 });

            useEffect(() => {
                if (!targetDate) return;
                const update = () => {
                    const diff = new Date(targetDate).getTime() - new Date().getTime();
                    if (diff <= 0) {
                        setTimeLeft({ j: 0, h: 0, m: 0, s: 0 });
                        return;
                    }
                    setTimeLeft({
                        j: Math.floor(diff / (1000 * 60 * 60 * 24)),
                        h: Math.floor((diff / (1000 * 60 * 60)) % 24),
                        m: Math.floor((diff / (1000 * 60)) % 60),
                        s: Math.floor((diff / 1000) % 60)
                    });
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

            return (
                <div className="flex gap-2 text-center">
                    {[
                        { label: 'J', val: timeLeft.j },
                        { label: 'H', val: timeLeft.h },
                        { label: 'M', val: timeLeft.m },
                        { label: 'S', val: timeLeft.s }
                    ].map((item, idx) => (
                        <div key={idx} className="bg-zinc-900/80 border border-zinc-800 rounded-lg px-2.5 py-1.5 min-w-[42px]">
                            <div className="text-lg font-bold font-heading text-zinc-400 leading-tight">{String(item.val).padStart(2, '0')}</div>
                            <div className="text-[10px] text-zinc-500 font-semibold">{item.label}</div>
                        </div>
                    ))}
                </div>
            );
        };

        const Podium = ({ top3 }) => {
            if (!top3 || top3.length === 0) return null;
            const [first, second, third] = top3;

            const renderCard = (player, place, glowClass, crownColor) => {
                if (!player) return null;
                const wr = calculateWR(player.wins || 0, player.losses || 0);
                return (
                    <div className={`relative bg-zinc-900 rounded-2xl p-5 border flex flex-col items-center ${glowClass} transition-transform hover:-translate-y-1`}>
                        <div className={`absolute -top-3.5 px-3 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider flex items-center gap-1 ${crownColor}`}>
                            <Trophy size={13} /> {place}
                        </div>
                        <div className="relative mt-3 mb-3">
                            <img 
                                src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                alt={player.playerName}
                                className="w-20 h-20 rounded-full object-cover border-2 border-zinc-700 shadow-lg"
                            />
                            <div className="absolute -bottom-1 -right-1">
                                <RankBadge rank={player.rank} />
                            </div>
                        </div>
                        <h4 className="font-heading text-xl font-bold text-white tracking-wide">{player.playerName}</h4>
                        <span className="text-xs font-mono text-zinc-400 mb-2">{player.riotId}</span>
                        {player.team && <div className="mb-2"><TeamTag team={player.team} /></div>}
                        <div className="text-2xl font-black font-heading text-zinc-100 mb-2">
                            {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} <span className="text-sm font-semibold text-zinc-400">LP</span>
                        </div>
                        <div className="w-full pt-3 border-t border-zinc-800 flex justify-between text-xs text-zinc-400">
                            <span>{player.wins || 0}V - {player.losses || 0}D</span>
                            <span className={wr >= 50 ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>{wr}% WR</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 items-end">
                    <div className="order-2 md:order-1">{renderCard(second, '2e place', 'border-zinc-700', 'bg-zinc-400 text-zinc-950')}</div>
                    <div className="order-1 md:order-2 -mt-4">{renderCard(first, '1ère place', 'border-zinc-500 scale-105', 'bg-zinc-100 text-zinc-900')}</div>
                    <div className="order-3 md:order-3">{renderCard(third, '3e place', 'border-zinc-700', 'bg-zinc-600 text-zinc-100')}</div>
                </div>
            );
        };

        const Leaderboard = ({ players, isAdmin, onRequestDelete, onRequestEdit }) => {
            const [search, setSearch] = useState('');
            const [teamFilter, setTeamFilter] = useState('all');

            const sorted = useMemo(() => {
                return [...players].sort((a, b) => (b.lpDelta || 0) - (a.lpDelta || 0));
            }, [players]);

            const filtered = useMemo(() => {
                const s = search.toLowerCase();
                return sorted.filter(p =>
                    (teamFilter === 'all' || (teamFilter === 'none' ? !p.team : p.team === teamFilter)) &&
                    ((p.playerName || '').toLowerCase().includes(s) || (p.riotId || '').toLowerCase().includes(s))
                );
            }, [sorted, search, teamFilter]);

            const top3 = sorted.slice(0, 3);

            return (
                <div className="space-y-6">
                    <TeamScoreboard players={players} />
                    <Podium top3={top3} />

                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                                <Flame className="text-zinc-400" /> Classement en direct
                            </h2>
                            <p className="text-xs text-zinc-400 mt-0.5">Trié selon la progression absolue en LP depuis le coup d'envoi.</p>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                            <div className="flex bg-zinc-900 border border-zinc-700/70 rounded-xl p-1 text-xs font-heading font-bold uppercase">
                                {[['all', 'Tous', 'text-zinc-200'], ['rouge', 'Rouge', 'text-red-400'], ['bleu', 'Bleu', 'text-blue-400']].map(([k, label, color]) => (
                                    <button key={k} onClick={() => setTeamFilter(k)} className={`flex-1 px-3 py-1 rounded-lg transition ${teamFilter === k ? 'bg-zinc-700 ' + color : 'text-zinc-500 hover:text-zinc-300'}`}>{label}</button>
                                ))}
                            </div>
                            <input
                                type="text"
                                placeholder="Rechercher un streamer / joueur..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="bg-zinc-900 border border-zinc-700/70 rounded-xl px-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 w-full sm:w-64"
                            />
                        </div>
                    </div>

                    <div className="bg-zinc-900/60 rounded-2xl border border-zinc-800 shadow-2xl overflow-hidden backdrop-blur-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[760px]">
                                <thead>
                                    <tr className="bg-zinc-950 text-[11px] font-heading uppercase text-zinc-400 border-b border-zinc-800 tracking-wider">
                                        <th className="py-4 px-4 text-center w-14">#</th>
                                        <th className="py-4 px-4">Participant</th>
                                        <th className="py-4 px-4">Rang actuel</th>
                                        <th className="py-4 px-4 text-center">Score SoloQ</th>
                                        <th className="py-4 px-4 text-center">Winrate</th>
                                        <th className="py-4 px-4 text-center">Bilan V / D</th>
                                        {isAdmin && <th className="py-4 px-4 text-center w-20">Admin</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-800/60 text-sm">
                                    {filtered.length === 0 && (
                                        <tr><td colSpan="7" className="py-12 text-center text-zinc-500 italic">Aucun participant ne correspond à la recherche.</td></tr>
                                    )}
                                    {filtered.map((player, idx) => {
                                        const rankIndex = sorted.findIndex(p => p.id === player.id);
                                        const wr = calculateWR(player.wins || 0, player.losses || 0);
                                        const teamBorder = player.team === 'rouge' ? 'border-l-4 border-l-red-500/70' : player.team === 'bleu' ? 'border-l-4 border-l-blue-500/70' : 'border-l-4 border-l-transparent';

                                        return (
                                            <tr key={player.id} className={`hover:bg-zinc-800/30 transition-colors ${teamBorder}`}>
                                                <td className="py-3.5 px-4 text-center font-heading font-bold text-base">
                                                    {rankIndex === 0 ? <span className="text-zinc-100">1</span> :
                                                     rankIndex === 1 ? <span className="text-zinc-300">2</span> :
                                                     rankIndex === 2 ? <span className="text-zinc-500">3</span> :
                                                     <span className="text-zinc-500">{rankIndex + 1}</span>}
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="flex items-center gap-3">
                                                        <img 
                                                            src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                            className="w-10 h-10 rounded-full object-cover border border-zinc-700" 
                                                            alt=""
                                                        />
                                                        <div>
                                                            <div className="font-bold text-zinc-100 flex items-center gap-2">
                                                                {player.playerName}
                                                                {player.twitchUrl && (
                                                                    <a href={player.twitchUrl} target="_blank" rel="noreferrer" className="text-[#9146FF] hover:text-[#a970ff]">
                                                                        <Twitch size={13} />
                                                                    </a>
                                                                )}
                                                                <TeamTag team={player.team} />
                                                            </div>
                                                            <div className="text-xs font-mono text-zinc-400">{player.riotId}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <RankBadge rank={player.rank} />
                                                </td>
                                                <td className="py-3.5 px-4 text-center">
                                                    <span className={`font-heading font-bold text-lg ${player.lpDelta >= 0 ? 'text-zinc-100' : 'text-red-400'}`}>
                                                        {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="max-w-[120px] mx-auto text-center">
                                                        <span className={`text-xs font-bold ${wr >= 50 ? 'text-emerald-400' : 'text-red-400'}`}>{wr}%</span>
                                                        <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1">
                                                            <div className={`h-full ${wr >= 50 ? 'bg-emerald-500' : 'bg-red-500'}`} style={{ width: `${wr}%` }}></div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4 text-center font-medium text-xs">
                                                    <span className="text-emerald-400 font-bold">{player.wins || 0}V</span>
                                                    <span className="text-zinc-600 mx-1.5">/</span>
                                                    <span className="text-red-400 font-bold">{player.losses || 0}D</span>
                                                </td>
                                                {isAdmin && (
                                                    <td className="py-3.5 px-4 text-center">
                                                        <div className="flex justify-center gap-1">
                                                            <button onClick={() => onRequestEdit(player)} title="Modifier" className="p-1.5 text-zinc-500 hover:text-zinc-400 transition">
                                                                <Edit2 size={15} />
                                                            </button>
                                                            <button onClick={() => onRequestDelete(player)} title="Supprimer" className="p-1.5 text-zinc-500 hover:text-red-400 transition">
                                                                <X size={15} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayersList = ({ players }) => {
            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                            <Users className="text-zinc-400" /> Les Participants ({players.length})
                        </h2>
                        <p className="text-xs text-zinc-400 mt-0.5">Accède directement aux profils OP.GG et aux chaînes Twitch officielles.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {players.map(player => {
                            const wr = calculateWR(player.wins || 0, player.losses || 0);
                            return (
                                <div key={player.id} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-600 transition-all flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex items-center gap-3">
                                                <img 
                                                    src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                    alt="" 
                                                    className="w-14 h-14 rounded-full object-cover border-2 border-zinc-700"
                                                />
                                                <div>
                                                    <h3 className="font-heading text-xl font-bold text-white">{player.playerName}</h3>
                                                    <span className="text-xs font-mono text-zinc-400">{player.riotId}</span>
                                                    {player.team && <div className="mt-1"><TeamTag team={player.team} /></div>}
                                                </div>
                                            </div>
                                            <RankBadge rank={player.rank} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 mb-4 text-center">
                                            <div>
                                                <div className="text-[10px] text-zinc-500 uppercase font-heading">Progression</div>
                                                <div className="font-heading text-lg font-bold text-zinc-100">
                                                    {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] text-zinc-500 uppercase font-heading">Ratio V/D</div>
                                                <div className="font-heading text-lg font-bold text-zinc-200">

        const AdminPanel = ({ players, onAddPlayer, onUpdatePlayer, onAddHistory, onRequestEdit, onRequestReset }) => {
            const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem('riotApiKey') || ''; } catch { return ''; } });
            const [status, setStatus] = useState('');
            const [loading, setLoading] = useState(false);
            const [playerForm, setPlayerForm] = useState({ playerName: '', riotId: '', twitchUrl: '', team: '' });

            const handleSync = async () => {
                if (!apiKey.trim()) return setStatus("❌ Clé API Riot requise.");
                setLoading(true);
                setStatus("⏳ Synchronisation des invocateurs via le proxy Vercel...");
                let success = 0, errors = [];

                for (const p of players) {
                    try {
                        const [gameName, tagLine] = p.riotId.split('#');
                        const accRes = await fetch(`/api/riot?type=account&gameName=${encodeURIComponent(gameName.trim())}&tagLine=${encodeURIComponent(tagLine.trim())}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const accData = await accRes.json();
                        if (!accRes.ok) throw new Error(accData.error || `Erreur Account (${accRes.status})`);

                        const sumRes = await fetch(`/api/riot?type=summoner&value=${accData.puuid}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const sumData = await sumRes.json();
                        if (!sumRes.ok) throw new Error(sumData.error || `Erreur Summoner (${sumRes.status})`);

                        const legRes = await fetch(`/api/riot?type=league&value=${accData.puuid}&apiKey=${encodeURIComponent(apiKey.trim())}`);
                        const legData = await legRes.json();
                        if (!legRes.ok) throw new Error(legData.error || `Erreur League (${legRes.status})`);

                        const soloQ = Array.isArray(legData) ? legData.find(q => q.queueType === 'RANKED_SOLO_5x5') : null;
                        let rankStr = 'Unranked', rankLabel = 'Unranked', wins = 0, losses = 0, currentAbsLP = 0;
                        const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${sumData.profileIconId}.jpg`;

                        if (soloQ) {
                            rankStr = soloQ.tier.charAt(0).toUpperCase() + soloQ.tier.slice(1).toLowerCase();
                            const isApex = ['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(soloQ.tier.toUpperCase());
                            rankLabel = `${rankStr}${isApex ? '' : ' ' + soloQ.rank} · ${soloQ.leaguePoints} LP`;
                            wins = soloQ.wins;
                            losses = soloQ.losses;
                            currentAbsLP = calculateAbsoluteLP(soloQ.tier, soloQ.rank, soloQ.leaguePoints);
                        }

                        let startLP = p.startAbsoluteLP ?? currentAbsLP;
                        const newDelta = currentAbsLP - startLP;

                        // Historique : on enregistre seulement s'il y a eu du mouvement depuis la dernière synchro
                        const hasPrevious = p.currentAbsoluteLP !== undefined && p.currentAbsoluteLP !== null;
                        if (hasPrevious) {
                            const change = currentAbsLP - p.currentAbsoluteLP;
                            const winsGained = Math.max(0, wins - (p.wins || 0));
                            const lossesGained = Math.max(0, losses - (p.losses || 0));
                            if (change !== 0 || winsGained > 0 || lossesGained > 0) {
                                await onAddHistory({
                                    type: 'game',
                                    playerId: p.id,
                                    playerName: p.playerName,
                                    team: p.team || '',
                                    timestamp: Date.now(),
                                    change,
                                    winsGained,
                                    lossesGained,
                                    rankBefore: p.rankLabel || p.rank || 'Unranked',
                                    rankAfter: rankLabel,
                                    deltaAfter: newDelta
                                });
                            }
                        }

                        await onUpdatePlayer(p.id, {
                            rank: rankStr,
                            rankLabel,
                            wins,
                            losses,
                            profileImg: iconUrl,
                            startAbsoluteLP: startLP,
                            currentAbsoluteLP: currentAbsLP,
                            lpDelta: newDelta
                        });
                        success++;
                        await new Promise(r => setTimeout(r, 200));
                    } catch (err) {
                        errors.push(`${p.playerName} : ${err.message}`);
                    }
                }
                setStatus(errors.length ? `⚠️ ${success} mis à jour, erreurs :\n${errors.join('\n')}` : `✅ ${success} joueur(s) synchronisés avec succès.`);
                setLoading(false);

                                onChange={e => setPlayerForm({...playerForm, riotId: e.target.value})}

                            />
                            <input 
                                placeholder="URL Twitch (optionnel)" 
                                value={playerForm.twitchUrl}
                                onChange={e => setPlayerForm({...playerForm, twitchUrl: e.target.value})}
                                className="bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                        </div>
                        <div className="mb-4">
                            <TeamPicker value={playerForm.team} onChange={team => setPlayerForm({ ...playerForm, team })} />
                        </div>
                        <button type="submit" className="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold py-2.5 rounded-xl transition">

                    <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">

            const [players, setPlayers] = useState([]);
            const [config, setConfig] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwd, setPwd] = useState('');
            const [toDelete, setToDelete] = useState(null);
            const [toEdit, setToEdit] = useState(null);
            const [history, setHistory] = useState([]);
            const [showReset, setShowReset] = useState(false);
            const [clearHistory, setClearHistory] = useState(false);
            const [resetting, setResetting] = useState(false);

            useEffect(() => {
                if (!auth) return;
                signInAnonymously(auth).catch(err => console.error(err));
                onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const unsubP = onSnapshot(collection(db, 'players'), snap => {
                    setPlayers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubC = onSnapshot(doc(db, 'config', 'main'), snap => {
                    if (snap.exists()) setConfig(snap.data());
                });
                const unsubH = onSnapshot(
                    query(collection(db, 'history'), orderBy('timestamp', 'desc'), limit(500)),
                    snap => setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error('Historique :', err)
                );
                return () => { unsubP(); unsubC(); unsubH(); };
            }, [user]);

            const crud = {
                add: async data => addDoc(collection(db, 'players'), data),
                update: async (id, data) => updateDoc(doc(db, 'players', id), data),
                del: async id => deleteDoc(doc(db, 'players', id)),
                updateConfig: async data => setDoc(doc(db, 'config', 'main'), data, { merge: true }),
                addHistory: async data => addDoc(collection(db, 'history'), data)
            };

            // Remet tous les compteurs LP à 0 : le LP actuel devient le nouveau point de départ
            const resetLP = async () => {
                setResetting(true);
                try {
                    const batch = writeBatch(db);
                    players.forEach(p => {
                        batch.update(doc(db, 'players', p.id), {
                            startAbsoluteLP: p.currentAbsoluteLP ?? null,
                            lpDelta: 0
                        });
                    });
                    await batch.commit();

                    if (clearHistory) {
                        const snap = await getDocs(collection(db, 'history'));
                        for (let i = 0; i < snap.docs.length; i += 400) {
                            const b = writeBatch(db);
                            snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
                            await b.commit();
                        }
                    }
                    await crud.addHistory({ type: 'reset', timestamp: Date.now() });
                    setShowReset(false);
                    setClearHistory(false);
                } catch (e) {
                    console.error(e);
                    alert('Erreur pendant la réinitialisation : ' + e.message);
                } finally {
                    setResetting(false);
                }
            };

            const stats = useMemo(() => {
                const totalGames = players.reduce((acc, p) => acc + (p.wins || 0) + (p.losses || 0), 0);
                return { totalGames, count: players.length };
            }, [players]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header soloqchallenge.fr style */}
                    <header className="border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-lg bg-zinc-100 flex items-center justify-center font-heading font-black text-zinc-900 text-lg">
                                        SQ
                                    </div>
                                    <span className="font-heading font-black text-2xl tracking-wider text-zinc-100">
                                        SOLOQ CHALLENGE
                                    </span>
                                </div>
                                <div className="hidden lg:flex items-center gap-4 text-xs font-heading uppercase text-zinc-400 pl-6 border-l border-zinc-800">
                                    <div>Participants : <span className="text-white font-bold">{stats.count}</span></div>
                                    <div>Parties jouées : <span className="text-zinc-400 font-bold">{stats.totalGames}</span></div>
                                </div>
                            </div>

                            <nav className="flex flex-wrap items-center gap-1.5 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                                <button onClick={() => setTab('classement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'classement' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Classement</button>
                                <button onClick={() => setTab('joueurs')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'joueurs' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Joueurs</button>
                                <button onClick={() => setTab('historique')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'historique' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Historique</button>
                                <button onClick={() => setTab('reglement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'reglement' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Règles</button>
                                {isAdmin && <button onClick={() => setTab('admin')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'admin' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Admin</button>}
                                
                                <div className="w-px h-4 bg-zinc-700 mx-1"></div>
                                {isAdmin ? (
                                    <button onClick={() => setIsAdmin(false)} className="px-2 py-1 text-red-400 text-xs font-heading font-bold">Quitter</button>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="p-1.5 text-zinc-500 hover:text-white transition"><Lock size={14}/></button>
                                )}
                            </nav>
                        </div>
                    </header>

                    {/* Main content */}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {tab === 'classement' && <Leaderboard players={players} isAdmin={isAdmin} onRequestDelete={setToDelete} onRequestEdit={setToEdit} />}
                        {tab === 'joueurs' && <PlayersList players={players} />}
                        {tab === 'historique' && <HistoryView history={history} players={players} />}
                        {tab === 'reglement' && <RulesView config={config} />}
                        {tab === 'admin' && isAdmin && (
                            <AdminPanel
                                players={players}
                                onAddPlayer={crud.add}
                                onUpdatePlayer={crud.update}
                                onAddHistory={crud.addHistory}
                                onRequestEdit={setToEdit}
                                onRequestReset={() => setShowReset(true)}
                            />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-zinc-800/80 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
                        SoloQ Challenge — Plateforme non affiliée à Riot Games. Données synchronisées via l'API Riot Games.
                    </footer>

                    {/* Admin Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 shadow-2xl">
                                <div className="flex justify-between mb-4">
                                    <h3 className="font-heading font-bold text-lg text-white">Accès Organisateur</h3>
                                    <button onClick={() => setShowLogin(false)} className="text-zinc-400"><X size={18}/></button>
                                </div>
                                <input 
                                    type="password" 
                                    value={pwd} 
                                    onChange={e => setPwd(e.target.value)} 
                                    placeholder="Mot de passe admin" 
                                    className="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 mb-4 text-white text-sm"
                                />
                                <button 
                                    onClick={() => { if (pwd === 'Hussein180690') { setIsAdmin(true); setShowLogin(false); setPwd(''); } }} 
                                    className="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold py-2.5 rounded-xl transition"
                                >
                                    Déverrouiller
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {toEdit && isAdmin && (
                        <PlayerEditModal player={toEdit} onClose={() => setToEdit(null)} onSave={crud.update} />
                    )}

                    {/* Reset Modal */}
                    {showReset && isAdmin && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 text-center">
                                <RotateCcw className="mx-auto text-zinc-400 mb-2" size={28} />
                                <h3 className="font-heading font-bold text-lg text-white mb-2">Réinitialiser les compteurs LP ?</h3>
                                <p className="text-xs text-zinc-400 mb-4">Tous les joueurs et les deux équipes repartent à 0 LP à partir de leur rang actuel.</p>
                                <label className="flex items-center justify-center gap-2 text-xs text-zinc-300 mb-6 cursor-pointer">
                                    <input type="checkbox" checked={clearHistory} onChange={e => setClearHistory(e.target.checked)} className="accent-red-500" />
                                    Vider aussi l'historique
                                </label>
                                <div className="flex gap-3">
                                    <button onClick={() => { setShowReset(false); setClearHistory(false); }} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-heading font-bold py-2 rounded-xl text-sm">Annuler</button>
                                    <button onClick={resetLP} disabled={resetting} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-heading font-bold py-2 rounded-xl text-sm disabled:opacity-50">{resetting ? 'En cours...' : 'Réinitialiser'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Delete Modal */}
                    {toDelete && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 text-center">
                                <h3 className="font-heading font-bold text-lg text-white mb-2">Retirer {toDelete.playerName} ?</h3>
                                <p className="text-xs text-zinc-400 mb-6">Cette action est définitive et supprimera ses stats du classement.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setToDelete(null)} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-heading font-bold py-2 rounded-xl text-sm">Annuler</button>
                                    <button onClick={() => { crud.del(toDelete.id); setToDelete(null); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-heading font-bold py-2 rounded-xl text-sm">Supprimer</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
