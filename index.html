<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloQ Challenge — Leaderboard Officiel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel pour le JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            background: #0a0a0b;
            color: #e4e4e7; 
            font-family: 'Inter', sans-serif; 
        }
        
        h1, h2, h3, .font-heading {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

            </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Trophy, Swords, Flame, ShieldAlert, Award, Clock, Users, 
            ExternalLink, Settings, UserPlus, Edit2, Check, X, Lock, 
            Twitch, Gamepad2, ArrowUpRight, ChevronRight, Sparkles,
            RotateCcw, History, Shield, ShoppingBag, Ban, Coins, Dices, ArrowLeftRight, Zap, Skull, Trash2
        } from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, query, orderBy, limit, writeBatch, getDocs, where, runTransaction, serverTimestamp } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyBwNrlXY81VOXtp2EGyFb_k3OWHKbtcY2o",
            authDomain: "soloq-challenge-5a13b.firebaseapp.com",
            projectId: "soloq-challenge-5a13b",
            storageBucket: "soloq-challenge-5a13b.firebasestorage.app",
            messagingSenderId: "206777469457",
            appId: "1:206777469457:web:5945045a4d26f2c04cbfb0",
            measurementId: "G-GZEVTXYQVP"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error(e);
        }

        const RANKS = ['Unranked', 'Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Emerald', 'Diamond', 'Master', 'Grandmaster', 'Challenger'];

        const TIER_VALUES = {
            'IRON': 0, 'BRONZE': 400, 'SILVER': 800, 'GOLD': 1200, 'PLATINUM': 1600,
            'EMERALD': 2000, 'DIAMOND': 2400, 'MASTER': 2800, 'GRANDMASTER': 2800, 'CHALLENGER': 2800
        };
        const RANK_VALUES = { 'IV': 0, 'III': 100, 'II': 200, 'I': 300 };

        const calculateAbsoluteLP = (tier, rank, lp) => {
            const tierVal = TIER_VALUES[tier.toUpperCase()] || 0;
            const rankVal = (['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(tier.toUpperCase())) ? 0 : (RANK_VALUES[rank.toUpperCase()] || 0);
            return tierVal + rankVal + Number(lp);
        };

        const calculateWR = (wins, losses) => {
            const total = wins + losses;
            return total === 0 ? 0 : Math.round((wins / total) * 100);
        };

        const DEFAULT_ICON = 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg';

        const TEAMS = {
            rouge: { label: 'Équipe Rouge', short: 'Rouge', dot: 'bg-red-500', text: 'text-red-400', border: 'border-red-500/40', bg: 'bg-red-500/10', bar: 'bg-red-500', glow: 'shadow-none' },
            bleu:  { label: 'Équipe Bleue', short: 'Bleu',  dot: 'bg-blue-500', text: 'text-blue-400', border: 'border-blue-500/40', bg: 'bg-blue-500/10', bar: 'bg-blue-500', glow: 'shadow-none' }
        };

        const formatLP = (v) => {
            const n = Number(v) || 0;
            return n > 0 ? `+${n}` : `${n}`;
        };

        const formatDate = (ts) => {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        };

        const TeamTag = ({ team }) => {
            const t = TEAMS[team];
            if (!t) return null;
            return (
                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold font-heading uppercase tracking-wider border ${t.bg} ${t.text} ${t.border}`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${t.dot}`}></span>{t.short}
                </span>
            );
        };

        // Compteur global par équipe (somme des LP gagnés/perdus + bilan V/D)
        const TeamScoreboard = ({ players }) => {
            const totals = useMemo(() => {
                const base = () => ({ lp: 0, wins: 0, losses: 0, count: 0 });
                const res = { rouge: base(), bleu: base() };
                players.forEach(p => {
                    if (!res[p.team]) return;
                    res[p.team].lp += Number(p.lpDelta) || 0;
                    res[p.team].wins += Number(p.wins) || 0;
                    res[p.team].losses += Number(p.losses) || 0;
                    res[p.team].count += 1;
                });
                return res;
            }, [players]);

            if (totals.rouge.count === 0 && totals.bleu.count === 0) return null;

            const r = totals.rouge.lp, b = totals.bleu.lp;
            // Barre de domination : basée sur l'écart, centrée à 50 %
            const span = Math.max(Math.abs(r), Math.abs(b), 1);
            const redShare = Math.min(95, Math.max(5, 50 + ((r - b) / (2 * span)) * 50));
            const leader = r === b ? null : (r > b ? 'rouge' : 'bleu');

            const side = (key) => {
                const t = TEAMS[key], s = totals[key];
                const wr = calculateWR(s.wins, s.losses);
                return (
                    <div className={`flex-1 rounded-2xl border p-5 bg-zinc-900/60 ${t.border} ${leader === key ? t.glow : ''} ${key === 'bleu' ? 'text-right' : ''}`}>
                        <div className={`flex items-center gap-2 font-heading font-bold uppercase tracking-wider text-sm ${t.text} ${key === 'bleu' ? 'justify-end' : ''}`}>
                            <Shield size={15} /> {t.label}
                            {leader === key && <Trophy size={14} className="text-zinc-100" />}
                        </div>
                        <div className={`font-heading font-black text-4xl mt-1 ${s.lp >= 0 ? 'text-white' : 'text-red-300'}`}>
                            {formatLP(s.lp)} <span className="text-base font-semibold text-zinc-400">LP</span>
                        </div>
                        <div className="text-xs text-zinc-400 mt-1">
                            {s.count} joueur{s.count > 1 ? 's' : ''} · {s.wins}V / {s.losses}D · <span className={wr >= 50 ? 'text-emerald-400' : 'text-red-400'}>{wr}% WR</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="mb-10">
                    <div className="flex flex-col sm:flex-row gap-3 items-stretch">
                        {side('rouge')}
                        <div className="flex items-center justify-center font-heading font-black text-zinc-500 text-xl px-2">
                            <Swords size={22} />
                        </div>
                        {side('bleu')}
                    </div>
                    <div className="mt-3 h-2 rounded-full overflow-hidden flex bg-zinc-800">
                        <div className={`${TEAMS.rouge.bar} transition-all duration-700`} style={{ width: `${redShare}%` }}></div>
                        <div className={`${TEAMS.bleu.bar} transition-all duration-700`} style={{ width: `${100 - redShare}%` }}></div>
                    </div>
                </div>
            );
        };

        const RankBadge = ({ rank = 'Unranked' }) => {
            const colors = {
                Challenger: 'bg-amber-400/10 text-amber-300 border-amber-400/40',
                Grandmaster: 'bg-red-500/10 text-red-400 border-red-500/40',
                Master: 'bg-purple-500/10 text-purple-300 border-purple-500/40',
                Diamond: 'bg-blue-400/10 text-blue-300 border-blue-400/40',
                Emerald: 'bg-emerald-400/10 text-emerald-300 border-emerald-400/40',
                Platinum: 'bg-teal-400/10 text-teal-300 border-teal-400/40',
                Gold: 'bg-yellow-500/10 text-yellow-300 border-yellow-500/40',
                Silver: 'bg-zinc-300/10 text-zinc-300 border-zinc-300/40',
                Bronze: 'bg-amber-700/10 text-amber-500 border-amber-700/40',
                Iron: 'bg-zinc-500/10 text-zinc-400 border-zinc-500/40',
                Unranked: 'bg-zinc-800 text-zinc-500 border-zinc-700'
            };
            const style = colors[rank] || colors['Unranked'];
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider border ${style}`}>
                    {rank}
                </span>
            );
        };

        const Countdown = ({ targetDate }) => {
            const [timeLeft, setTimeLeft] = useState({ j: 0, h: 0, m: 0, s: 0 });

            useEffect(() => {
                if (!targetDate) return;
                const update = () => {
                    const diff = new Date(targetDate).getTime() - new Date().getTime();
                    if (diff <= 0) {
                        setTimeLeft({ j: 0, h: 0, m: 0, s: 0 });
                        return;
                    }
                    setTimeLeft({
                        j: Math.floor(diff / (1000 * 60 * 60 * 24)),
                        h: Math.floor((diff / (1000 * 60 * 60)) % 24),
                        m: Math.floor((diff / (1000 * 60)) % 60),
                        s: Math.floor((diff / 1000) % 60)
                    });
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

            return (
                <div className="flex gap-2 text-center">
                    {[
                        { label: 'J', val: timeLeft.j },
                        { label: 'H', val: timeLeft.h },
                        { label: 'M', val: timeLeft.m },
                        { label: 'S', val: timeLeft.s }
                    ].map((item, idx) => (
                        <div key={idx} className="bg-zinc-900/80 border border-zinc-800 rounded-lg px-2.5 py-1.5 min-w-[42px]">
                            <div className="text-lg font-bold font-heading text-zinc-400 leading-tight">{String(item.val).padStart(2, '0')}</div>
                            <div className="text-[10px] text-zinc-500 font-semibold">{item.label}</div>
                        </div>
                    ))}
                </div>
            );
        };

        const Podium = ({ top3 }) => {
            if (!top3 || top3.length === 0) return null;
            const [first, second, third] = top3;

            const renderCard = (player, place, glowClass, crownColor) => {
                if (!player) return null;
                const wr = calculateWR(player.wins || 0, player.losses || 0);
                return (
                    <div className={`relative bg-zinc-900 rounded-2xl p-5 border flex flex-col items-center ${glowClass} transition-transform hover:-translate-y-1`}>
                        <div className={`absolute -top-3.5 px-3 py-0.5 rounded-full text-xs font-bold font-heading uppercase tracking-wider flex items-center gap-1 ${crownColor}`}>
                            <Trophy size={13} /> {place}
                        </div>
                        <div className="relative mt-3 mb-3">
                            <img 
                                src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                alt={player.playerName}
                                className="w-20 h-20 rounded-full object-cover border-2 border-zinc-700 shadow-lg"
                            />
                            <div className="absolute -bottom-1 -right-1">
                                <RankBadge rank={player.rank} />
                            </div>
                        </div>
                        <h4 className="font-heading text-xl font-bold text-white tracking-wide">{player.playerName}</h4>
                        <span className="text-xs font-mono text-zinc-400 mb-2">{player.riotId}</span>
                        {player.team && <div className="mb-2"><TeamTag team={player.team} /></div>}
                        <div className="text-2xl font-black font-heading text-zinc-100 mb-2">
                            {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} <span className="text-sm font-semibold text-zinc-400">LP</span>
                        </div>
                        <div className="w-full pt-3 border-t border-zinc-800 flex justify-between text-xs text-zinc-400">
                            <span>{player.wins || 0}V - {player.losses || 0}D</span>
                            <span className={wr >= 50 ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>{wr}% WR</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 items-end">
                    <div className="order-2 md:order-1">{renderCard(second, '2e place', 'border-zinc-700', 'bg-zinc-400 text-zinc-950')}</div>
                    <div className="order-1 md:order-2 -mt-4">{renderCard(first, '1ère place', 'border-zinc-500 scale-105', 'bg-zinc-100 text-zinc-900')}</div>
                    <div className="order-3 md:order-3">{renderCard(third, '3e place', 'border-zinc-700', 'bg-zinc-600 text-zinc-100')}</div>
                </div>
            );
        };

        const Leaderboard = ({ players, isAdmin, onRequestDelete, onRequestEdit }) => {
            const [search, setSearch] = useState('');
            const [teamFilter, setTeamFilter] = useState('all');

            const sorted = useMemo(() => {
                return [...players].sort((a, b) => (b.lpDelta || 0) - (a.lpDelta || 0));
            }, [players]);

            const filtered = useMemo(() => {
                const s = search.toLowerCase();
                return sorted.filter(p =>
                    (teamFilter === 'all' || (teamFilter === 'none' ? !p.team : p.team === teamFilter)) &&
                    ((p.playerName || '').toLowerCase().includes(s) || (p.riotId || '').toLowerCase().includes(s))
                );
            }, [sorted, search, teamFilter]);

            const top3 = sorted.slice(0, 3);

            return (
                <div className="space-y-6">
                    <TeamScoreboard players={players} />
                    <Podium top3={top3} />

                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                                <Flame className="text-zinc-400" /> Classement en direct
                            </h2>
                            <p className="text-xs text-zinc-400 mt-0.5">Trié selon la progression absolue en LP depuis le coup d'envoi.</p>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                            <div className="flex bg-zinc-900 border border-zinc-700/70 rounded-xl p-1 text-xs font-heading font-bold uppercase">
                                {[['all', 'Tous', 'text-zinc-200'], ['rouge', 'Rouge', 'text-red-400'], ['bleu', 'Bleu', 'text-blue-400']].map(([k, label, color]) => (
                                    <button key={k} onClick={() => setTeamFilter(k)} className={`flex-1 px-3 py-1 rounded-lg transition ${teamFilter === k ? 'bg-zinc-700 ' + color : 'text-zinc-500 hover:text-zinc-300'}`}>{label}</button>
                                ))}
                            </div>
                            <input
                                type="text"
                                placeholder="Rechercher un streamer / joueur..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="bg-zinc-900 border border-zinc-700/70 rounded-xl px-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 w-full sm:w-64"
                            />
                        </div>
                    </div>

                    <div className="bg-zinc-900/60 rounded-2xl border border-zinc-800 shadow-2xl overflow-hidden backdrop-blur-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[760px]">
                                <thead>
                                    <tr className="bg-zinc-950 text-[11px] font-heading uppercase text-zinc-400 border-b border-zinc-800 tracking-wider">
                                        <th className="py-4 px-4 text-center w-14">#</th>
                                        <th className="py-4 px-4">Participant</th>
                                        <th className="py-4 px-4">Rang actuel</th>
                                        <th className="py-4 px-4 text-center">Score SoloQ</th>
                                        <th className="py-4 px-4 text-center">Winrate</th>
                                        <th className="py-4 px-4 text-center">Bilan V / D</th>
                                        {isAdmin && <th className="py-4 px-4 text-center w-20">Admin</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-800/60 text-sm">
                                    {filtered.length === 0 && (
                                        <tr><td colSpan="7" className="py-12 text-center text-zinc-500 italic">Aucun participant ne correspond à la recherche.</td></tr>
                                    )}
                                    {filtered.map((player, idx) => {
                                        const rankIndex = sorted.findIndex(p => p.id === player.id);
                                        const wr = calculateWR(player.wins || 0, player.losses || 0);
                                        const teamBorder = player.team === 'rouge' ? 'border-l-4 border-l-red-500/70' : player.team === 'bleu' ? 'border-l-4 border-l-blue-500/70' : 'border-l-4 border-l-transparent';

                                        return (
                                            <tr key={player.id} className={`hover:bg-zinc-800/30 transition-colors ${teamBorder}`}>
                                                <td className="py-3.5 px-4 text-center font-heading font-bold text-base">
                                                    {rankIndex === 0 ? <span className="text-zinc-100">1</span> :
                                                     rankIndex === 1 ? <span className="text-zinc-300">2</span> :
                                                     rankIndex === 2 ? <span className="text-zinc-500">3</span> :
                                                     <span className="text-zinc-500">{rankIndex + 1}</span>}
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="flex items-center gap-3">
                                                        <img 
                                                            src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                            className="w-10 h-10 rounded-full object-cover border border-zinc-700" 
                                                            alt=""
                                                        />
                                                        <div>
                                                            <div className="font-bold text-zinc-100 flex items-center gap-2">
                                                                {player.playerName}
                                                                {player.twitchUrl && (
                                                                    <a href={player.twitchUrl} target="_blank" rel="noreferrer" className="text-[#9146FF] hover:text-[#a970ff]">
                                                                        <Twitch size={13} />
                                                                    </a>
                                                                )}
                                                                <TeamTag team={player.team} />
                                                            </div>
                                                            <div className="text-xs font-mono text-zinc-400">{player.riotId}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <RankBadge rank={player.rank} />
                                                </td>
                                                <td className="py-3.5 px-4 text-center">
                                                    <span className={`font-heading font-bold text-lg ${player.lpDelta >= 0 ? 'text-zinc-100' : 'text-red-400'}`}>
                                                        {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                    </span>
                                                    {!!player.lpAdjust && <div className="text-[10px] text-zinc-500">dont {formatLP(player.lpAdjust)} boutique</div>}
                                                </td>
                                                <td className="py-3.5 px-4">
                                                    <div className="max-w-[120px] mx-auto text-center">
                                                        <span className={`text-xs font-bold ${wr >= 50 ? 'text-emerald-400' : 'text-red-400'}`}>{wr}%</span>
                                                        <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1">
                                                            <div className={`h-full ${wr >= 50 ? 'bg-emerald-500' : 'bg-red-500'}`} style={{ width: `${wr}%` }}></div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4 text-center font-medium text-xs">
                                                    <span className="text-emerald-400 font-bold">{player.wins || 0}V</span>
                                                    <span className="text-zinc-600 mx-1.5">/</span>
                                                    <span className="text-red-400 font-bold">{player.losses || 0}D</span>
                                                </td>
                                                {isAdmin && (
                                                    <td className="py-3.5 px-4 text-center">
                                                        <div className="flex justify-center gap-1">
                                                            <button onClick={() => onRequestEdit(player)} title="Modifier" className="p-1.5 text-zinc-500 hover:text-zinc-400 transition">
                                                                <Edit2 size={15} />
                                                            </button>
                                                            <button onClick={() => onRequestDelete(player)} title="Supprimer" className="p-1.5 text-zinc-500 hover:text-red-400 transition">
                                                                <X size={15} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayersList = ({ players }) => {
            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                            <Users className="text-zinc-400" /> Les Participants ({players.length})
                        </h2>
                        <p className="text-xs text-zinc-400 mt-0.5">Accède directement aux profils OP.GG et aux chaînes Twitch officielles.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {players.map(player => {
                            const wr = calculateWR(player.wins || 0, player.losses || 0);
                            return (
                                <div key={player.id} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-600 transition-all flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex items-center gap-3">
                                                <img 
                                                    src={player.profileImg || 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg'} 
                                                    alt="" 
                                                    className="w-14 h-14 rounded-full object-cover border-2 border-zinc-700"
                                                />
                                                <div>
                                                    <h3 className="font-heading text-xl font-bold text-white">{player.playerName}</h3>
                                                    <span className="text-xs font-mono text-zinc-400">{player.riotId}</span>
                                                    {player.team && <div className="mt-1"><TeamTag team={player.team} /></div>}
                                                </div>
                                            </div>
                                            <RankBadge rank={player.rank} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 mb-4 text-center">
                                            <div>
                                                <div className="text-[10px] text-zinc-500 uppercase font-heading">Progression</div>
                                                <div className="font-heading text-lg font-bold text-zinc-100">
                                                    {player.lpDelta > 0 ? `+${player.lpDelta}` : player.lpDelta || 0} LP
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] text-zinc-500 uppercase font-heading">Ratio V/D</div>
                                                <div className="font-heading text-lg font-bold text-zinc-200">
                                                    {player.wins || 0}W <span className="text-xs text-zinc-500 font-normal">/</span> {player.losses || 0}L
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <a 
                                            href={`https://www.op.gg/summoners/euw/${encodeURIComponent(player.riotId.replace('#', '-'))}`} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded-xl py-2 px-3 text-xs font-bold font-heading flex items-center justify-center gap-1.5 transition"
                                        >
                                            <Gamepad2 size={14} /> OP.GG
                                        </a>
                                        {player.twitchUrl && (
                                            <a 
                                                href={player.twitchUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded-xl py-2 px-3 text-xs font-bold font-heading flex items-center justify-center gap-1.5 transition"
                                            >
                                                <Twitch size={14} className="text-[#9146FF]" /> Twitch
                                            </a>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ---------- Historique des parties (style OP.GG) ----------
        const SPELLS = { 1: 'SummonerBoost', 3: 'SummonerExhaust', 4: 'SummonerFlash', 6: 'SummonerHaste', 7: 'SummonerHeal', 11: 'SummonerSmite', 12: 'SummonerTeleport', 13: 'SummonerMana', 14: 'SummonerDot', 21: 'SummonerBarrier', 32: 'SummonerSnowball' };
        const MULTIKILLS = { 2: 'Double Kill', 3: 'Triple Kill', 4: 'Quadra Kill', 5: 'Penta Kill' };
        const QUEUES = { 420: 'Ranked Solo/Duo', 440: 'Ranked Flex' };

        let ddVersionPromise = null;
        const useDdragonVersion = () => {
            const [v, setV] = useState('15.1.1');
            useEffect(() => {
                if (!ddVersionPromise) {
                    ddVersionPromise = fetch('https://ddragon.leagueoflegends.com/api/versions.json')
                        .then(r => r.json()).then(a => a[0]).catch(() => null);
                }
                ddVersionPromise.then(x => { if (x) setV(x); });
            }, []);
            return v;
        };

        const timeAgo = (ts) => {
            const diff = Math.max(0, Date.now() - ts);
            const min = Math.floor(diff / 60000);
            if (min < 1) return "à l'instant";
            if (min < 60) return `il y a ${min} min`;
            const h = Math.floor(min / 60);
            if (h < 24) return `il y a ${h} h`;
            const d = Math.floor(h / 24);
            if (d < 14) return `il y a ${d} jour${d > 1 ? 's' : ''}`;
            const w = Math.floor(d / 7);
            if (d < 60) return `il y a ${w} semaines`;
            return `il y a ${Math.floor(d / 30)} mois`;
        };

        const formatDuration = (sec) => `${Math.floor((sec || 0) / 60)} m ${String((sec || 0) % 60).padStart(2, '0')} s`;

        const MatchRow = ({ h, player, version, shopFx = [] }) => {
            const win = !!h.win;
            const team = player?.team ?? h.team;
            const ddImg = (path) => `https://ddragon.leagueoflegends.com/cdn/${version}/img/${path}`;
            const parts = h.participants || [];
            const allies = parts.filter(x => x.t === h.teamId);
            const enemies = parts.filter(x => x.t !== h.teamId);
            const ratio = h.deaths === 0 ? 'Perfect' : `${(((h.kills || 0) + (h.assists || 0)) / h.deaths).toFixed(2)}:1`;
            const csMin = h.duration ? ((h.cs || 0) / (h.duration / 60)).toFixed(1) : '0.0';
            const items = Array.from({ length: 7 }, (_, i) => (h.items || [])[i] || 0);
            const lp = h.lpChange;

            const renderPart = (x, i) => (
                <div key={i} className="flex items-center gap-1.5 min-w-0">
                    <img src={ddImg(`champion/${x.c}.png`)} alt="" className="w-4 h-4 rounded shrink-0" onError={e => { e.currentTarget.style.visibility = 'hidden'; }} />
                    <span className={`truncate text-[12px] ${x.me ? 'text-white font-bold' : 'text-zinc-400'}`}>{x.n}</span>
                </div>
            );

            return (
                <div className={`rounded-xl border-l-4 px-4 py-3 ${win ? 'bg-blue-500/10 border-l-blue-500' : 'bg-red-500/10 border-l-red-500'}`}>
                  <div className="flex flex-wrap lg:flex-nowrap items-center gap-x-6 gap-y-3">
                    {/* Infos partie */}
                    <div className="w-40 shrink-0">
                        <div className="flex items-center gap-1.5 mb-1.5">
                            <img src={player?.profileImg || DEFAULT_ICON} alt="" className="w-5 h-5 rounded-full object-cover border border-zinc-700" />
                            <span className="text-xs font-bold text-zinc-100 truncate">{player?.playerName || h.playerName}</span>
                            <TeamTag team={team} />
                        </div>
                        <div className={`text-xs font-bold font-heading uppercase tracking-wide ${win ? 'text-blue-400' : 'text-red-400'}`}>{QUEUES[h.queueId] || 'Partie'}</div>
                        <div className="text-[11px] text-zinc-500">{timeAgo(h.timestamp)}</div>
                        <div className="w-8 border-t border-zinc-700 my-1.5"></div>
                        <div className={`text-xs font-bold ${win ? 'text-blue-400' : 'text-red-400'}`}>{win ? 'Victoire' : 'Défaite'}</div>
                        <div className="text-[11px] text-zinc-500">{formatDuration(h.duration)}</div>
                    </div>

                    {/* Champion + sorts */}
                    <div className="flex items-center gap-1.5 shrink-0">
                        <div className="relative">
                            <img src={ddImg(`champion/${h.championName}.png`)} alt={h.championName} title={h.championName} className="w-14 h-14 rounded-full border-2 border-zinc-700" onError={e => { e.currentTarget.style.visibility = 'hidden'; }} />
                            <span className="absolute -bottom-1 -right-1 bg-zinc-800 border border-zinc-600 text-[10px] text-zinc-200 rounded-full w-5 h-5 flex items-center justify-center font-bold">{h.champLevel}</span>
                        </div>
                        <div className="flex flex-col gap-1">
                            {(h.spells || []).map((sp, i) => SPELLS[sp] ? (
                                <img key={i} src={ddImg(`spell/${SPELLS[sp]}.png`)} alt="" className="w-6 h-6 rounded" onError={e => { e.currentTarget.style.visibility = 'hidden'; }} />
                            ) : <div key={i} className="w-6 h-6 rounded bg-zinc-800" />)}
                        </div>
                    </div>

                    {/* KDA */}
                    <div className="w-28 shrink-0 text-center">
                        <div className="font-heading font-bold text-xl text-white leading-tight">
                            {h.kills} <span className="text-zinc-500">/</span> <span className="text-red-400">{h.deaths}</span> <span className="text-zinc-500">/</span> {h.assists}
                        </div>
                        <div className="text-xs text-zinc-400">{ratio} KDA</div>
                        {lp !== null && lp !== undefined && (
                            <div className={`text-xs font-bold mt-1 ${lp > 0 ? 'text-emerald-400' : lp < 0 ? 'text-red-400' : 'text-zinc-400'}`}>{formatLP(lp)} LP</div>
                        )}
                    </div>

                    {/* CS / vision */}
                    <div className="w-28 shrink-0 text-xs text-zinc-400 leading-relaxed">
                        <div>CS {h.cs} <span className="text-zinc-500">({csMin})</span></div>
                        <div>Vision {h.vision ?? 0}</div>
                        {MULTIKILLS[h.multiKill] && <span className="inline-block mt-1 px-2 py-0.5 rounded-md bg-zinc-100 text-zinc-900 text-[10px] font-heading font-bold uppercase">{MULTIKILLS[h.multiKill]}</span>}
                    </div>

                    {/* Items */}
                    <div className="flex gap-1 shrink-0">
                        {items.map((it, i) => it ? (
                            <img key={i} src={ddImg(`item/${it}.png`)} alt="" className="w-7 h-7 rounded border border-zinc-800" onError={e => { e.currentTarget.style.visibility = 'hidden'; }} />
                        ) : <div key={i} className="w-7 h-7 rounded bg-zinc-800/80 border border-zinc-800" />)}
                    </div>

                    {/* Les 10 joueurs */}
                    <div className="hidden xl:grid grid-cols-2 gap-x-4 gap-y-0.5 w-72 shrink-0 ml-auto">
                        <div className="space-y-0.5 min-w-0">{allies.map(renderPart)}</div>
                        <div className="space-y-0.5 min-w-0">{enemies.map(renderPart)}</div>
                    </div>
                  </div>
                    {shopFx.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mt-3">
                            {shopFx.map(f => (
                                <span key={f.id} className="inline-flex items-center gap-1.5 text-[11px] rounded-lg border border-zinc-700 bg-zinc-900/80 px-2 py-1">
                                    <span className="font-bold text-zinc-200">{f.title}</span>
                                    <span className="text-zinc-500">· {f.by}</span>
                                    {f.test && <span className="px-1 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 text-[9px] font-bold">TEST</span>}
                                    {f.text && <span className={f.tone}>— {f.text}</span>}
                                </span>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const HistoryView = ({ history, players, purchases = [], statuses = {} }) => {
            const [playerFilter, setPlayerFilter] = useState('all');
            const [teamFilter, setTeamFilter] = useState('all');
            const version = useDdragonVersion();

            const playerById = useMemo(() => Object.fromEntries(players.map(p => [p.id, p])), [players]);

            const matches = useMemo(() => history
                .filter(h => h.type === 'match')
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)), [history]);

            // Achats de la boutique appliqués à chaque partie (bouclier, quitte ou double, ban, summoners)
            const fxByMatch = useMemo(() => {
                const map = {};
                const titles = { shield: '🛡️ Bouclier', double: '🎲 Quitte ou double', ban: '🚫 Ban', spells: '🔄 Summoners inversés' };
                purchases.forEach(x => {
                    const st = statuses[x.id];
                    if (!st || !st.matchDocId || !titles[x.kind]) return;
                    const d = describeStatus(x, st);
                    const title = x.kind === 'ban' ? `${titles.ban} ${x.championName || x.championKey || ''}`.trim() : titles[x.kind];
                    (map[st.matchDocId] = map[st.matchDocId] || []).push({ id: x.id, title, by: x.kind === 'shield' || x.kind === 'double' ? x.buyerName : `acheté par ${x.buyerName}`, test: x.test, text: d?.text, tone: d?.tone });
                });
                return map;
            }, [purchases, statuses]);

            const filtered = useMemo(() => matches.filter(h => {
                const p = playerById[h.playerId];
                const team = p?.team ?? h.team;
                if (playerFilter !== 'all' && h.playerId !== playerFilter) return false;
                if (teamFilter !== 'all' && team !== teamFilter) return false;
                return true;
            }), [matches, playerFilter, teamFilter, playerById]);

            // 100 dernières parties (déjà triées de la plus récente à la plus ancienne), regroupées par jour
            const shown = useMemo(() => filtered.slice(0, 100), [filtered]);
            const total = useMemo(() => ({ w: shown.filter(h => h.win).length, l: shown.filter(h => !h.win).length }), [shown]);
            const groups = useMemo(() => {
                const map = new Map();
                shown.forEach(h => {
                    const d = new Date(h.timestamp);
                    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                    if (!map.has(key)) {
                        const label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
                        map.set(key, { key, label: label.charAt(0).toUpperCase() + label.slice(1), items: [], w: 0, l: 0 });
                    }
                    const g = map.get(key);
                    g.items.push(h);
                    if (h.win) g.w++; else g.l++;
                });
                return [...map.values()];
            }, [shown]);

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2">
                                <History className="text-zinc-400" /> Historique des parties
                            </h2>
                            <p className="text-xs text-zinc-400 mt-0.5">Les 100 dernières parties classées solo/duo de tous les joueurs, triées par date, avec le bilan de chaque jour.</p>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                            <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="bg-zinc-900 border border-zinc-700/70 rounded-xl px-3 py-2 text-sm text-zinc-200">
                                <option value="all">Toutes les équipes</option>
                                <option value="rouge">Équipe Rouge</option>
                                <option value="bleu">Équipe Bleue</option>
                            </select>
                            <select value={playerFilter} onChange={e => setPlayerFilter(e.target.value)} className="bg-zinc-900 border border-zinc-700/70 rounded-xl px-3 py-2 text-sm text-zinc-200">
                                <option value="all">Tous les joueurs</option>
                                {[...players].sort((a, b) => (a.playerName || '').localeCompare(b.playerName || '')).map(p => (
                                    <option key={p.id} value={p.id}>{p.playerName}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {shown.length > 0 && (
                        <div className="flex items-center gap-3 text-xs text-zinc-400">
                            <span>{shown.length} dernière{shown.length > 1 ? 's' : ''} partie{shown.length > 1 ? 's' : ''}</span>
                            <span className="text-zinc-700">·</span>
                            <span><span className="text-blue-400 font-bold">{total.w}V</span> / <span className="text-red-400 font-bold">{total.l}D</span></span>
                            <span className="text-zinc-700">·</span>
                            <span>{calculateWR(total.w, total.l)}% WR</span>
                        </div>
                    )}

                    <div className="space-y-6">
                        {shown.length === 0 && (
                            <div className="bg-zinc-900/60 rounded-2xl border border-zinc-800 py-12 text-center text-zinc-500 italic text-sm">Aucune partie pour l'instant. Elles apparaissent après une synchronisation.</div>
                        )}
                        {groups.map(g => (
                            <div key={g.key} className="space-y-2">
                                <div className="flex items-center justify-between border-b border-zinc-800 pb-1.5">
                                    <h3 className="font-heading text-sm font-bold text-zinc-200 tracking-wide">{g.label}</h3>
                                    <div className="text-xs font-bold">
                                        <span className="text-blue-400">{g.w} victoire{g.w > 1 ? 's' : ''}</span>
                                        <span className="text-zinc-600 mx-1.5">/</span>
                                        <span className="text-red-400">{g.l} défaite{g.l > 1 ? 's' : ''}</span>
                                    </div>
                                </div>
                                {g.items.map(h => (
                                    <MatchRow key={h.id} h={h} player={playerById[h.playerId]} version={version} shopFx={fxByMatch[h.id] || []} />
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ---------- Boutique à points ----------
        const POINTS = { kill: 1, win: 3, deathsPerPenalty: 2 }; // 1 kill = +1 · victoire = +3 · toutes les 2 morts = -1
        const PRICES = { shield: 10, ban: 15 };

        // Identifiant du marqueur « 1 bonus / 1 malus par jour » d'un achat (sert à l'achat ET à l'annulation)
        const limitDocId = (x) => `limit_${x.buyerId}_${x.day || parisDay(x.createdAt)}_${x.category || categoryOf(x.kind, x.mode)}`;
        const purchaseLabel = (x) => ({
            ban: `ban de ${x.championName} pour ${x.targetName}`,
            shield: 'bouclier',
            double: 'quitte ou double',
            spells: `summoners inversés pour ${x.targetName}`,
            lpmove: x.mode === 'gain' ? `+${LPMOVE_LP} LP` : `−${LPMOVE_LP} LP à ${x.targetName}`
        }[x.kind] || 'achat');

        // Calcule les points de chaque joueur + le statut de chaque achat, uniquement à partir des parties et des achats enregistrés
        const computeShop = (players, matches, purchases) => {
            const startOf = (m) => m.gameCreation || ((m.timestamp || 0) - (m.duration || 0) * 1000);
            const gamesOf = (playerId) => matches
                .filter(m => m.playerId === playerId)
                .sort((a, b) => startOf(a) - startOf(b));
            const byPlayer = {};
            const statuses = {};

            players.forEach(pl => {
                // Remise à zéro des points : seules les parties lancées et les achats faits après comptent
                const since = pl.shopResetAt || 0;
                const ms = gamesOf(pl.id).filter(g => startOf(g) >= since);
                const mine = purchases.filter(x => x.buyerId === pl.id && (x.createdAt || 0) >= since);
                const shields = mine.filter(x => x.kind === 'shield').sort((a, b) => a.createdAt - b.createdAt);

                // Un bouclier protège la 1re partie lancée APRÈS son achat
                const shielded = {};
                shields.forEach(sh => {
                    const game = ms.find(g => startOf(g) >= sh.createdAt && !shielded[g.matchId]);
                    if (game) shielded[game.matchId] = sh.id;
                    else statuses[sh.id] = { state: 'active' };
                });

                let kills = 0, wins = 0, penalty = 0, saved = 0;
                ms.forEach(g => {
                    kills += g.kills || 0;
                    if (g.win) wins++;
                    const pen = Math.floor((g.deaths || 0) / POINTS.deathsPerPenalty);
                    const sid = shielded[g.matchId];
                    if (sid && !g.win) saved += pen; else penalty += pen;
                    if (sid) statuses[sid] = { state: 'used', win: !!g.win, saved: g.win ? 0 : pen, matchDocId: g.id };
                });

                const spent = mine.reduce((acc, x) => acc + (x.price || 0), 0);
                const earned = kills * POINTS.kill + wins * POINTS.win - penalty;
                byPlayer[pl.id] = {
                    games: ms.length, kills, wins, penalty, saved, spent, earned,
                    balance: earned - spent,
                    activeShields: shields.filter(sh => statuses[sh.id]?.state === 'active').length
                };
            });

            // Un ban vaut pour la 1re partie du joueur ciblé lancée après l'achat
            purchases.filter(x => x.kind === 'ban').forEach(b => {
                const game = gamesOf(b.targetId).find(g => startOf(g) >= b.createdAt);
                statuses[b.id] = !game ? { state: 'pending' } : {
                    state: 'used',
                    matchDocId: game.id,
                    played: game.championName,
                    violated: (game.championName || '').toLowerCase() === (b.championKey || '').toLowerCase()
                };
            });

            return { byPlayer, statuses };
        };

        const DEFAULT_PRICES = { shield: 10, double: 10, ban: 15, spells: 10, lpmove: 25 }; // modifiables depuis l'Admin
        const LPMOVE_LP = 10;
        const SPELL_NAMES = { 1: 'Purification', 3: 'Épuisement', 4: 'Saut éclair', 6: 'Fantôme', 7: 'Soin', 11: 'Châtiment', 12: 'Téléportation', 13: 'Clarté', 14: 'Embrasement', 21: 'Barrière', 32: 'Boule de neige' };

        const parisDay = (ts) => new Date(ts).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });
        // Bonus = pour soi · Malus = sur un adversaire (1 de chaque par jour et par joueur)
        const categoryOf = (kind, mode) => kind === 'lpmove' ? (mode === 'gain' ? 'bonus' : 'malus') : (['shield', 'double'].includes(kind) ? 'bonus' : 'malus');

        const VIOLATION_LP = 20; // pénalité pour un ban / des summoners inversés non respectés
        // Joueurs qui n'ont pas respecté un malus (ban joué quand même, summoners non inversés). Les achats de test ne comptent pas.
        const findViolations = (players, matches, purchases) => {
            const startOf = (m) => m.gameCreation || ((m.timestamp || 0) - (m.duration || 0) * 1000);
            const gamesOf = (playerId) => matches.filter(m => m.playerId === playerId).sort((a, b) => startOf(a) - startOf(b));
            const nameOf = (id) => players.find(p => p.id === id)?.playerName || '?';
            const out = [];
            purchases.filter(x => !x.test).forEach(x => {
                if (x.kind === 'ban') {
                    const game = gamesOf(x.targetId).find(g => startOf(g) >= x.createdAt);
                    if (game && (game.championName || '').toLowerCase() === (x.championKey || '').toLowerCase())
                        out.push({ id: x.id, kind: 'ban', offenderId: x.targetId, offenderName: nameOf(x.targetId), buyerName: x.buyerName, what: game.championName, createdAt: x.createdAt });
                } else if (x.kind === 'spells') {
                    const ms = gamesOf(x.targetId);
                    const idx = ms.findIndex(g => startOf(g) >= x.createdAt);
                    if (idx < 1) return;
                    const a = (ms[idx].spells || []).indexOf(4), b = (ms[idx - 1].spells || []).indexOf(4);
                    if (a >= 0 && b >= 0 && a === b)
                        out.push({ id: x.id, kind: 'spells', offenderId: x.targetId, offenderName: nameOf(x.targetId), buyerName: x.buyerName, what: 'summoners non inversés', createdAt: x.createdAt });
                }
            });
            return out;
        };

        // Effets sur les LP (quitte ou double, +10/-10 LP) et vérification des summoners inversés
        const computeEffects = (players, matches, purchases) => {
            const startOf = (m) => m.gameCreation || ((m.timestamp || 0) - (m.duration || 0) * 1000);
            const gamesOf = (playerId) => matches.filter(m => m.playerId === playerId).sort((a, b) => startOf(a) - startOf(b));
            const lpAdjust = {};
            const statuses = {};
            const resetAt = {};
            players.forEach(pl => { lpAdjust[pl.id] = { qod: 0, moves: 0, penalty: 0, total: 0 }; resetAt[pl.id] = pl.lpResetAt || 0; });

            // Quitte ou double : la 1re partie lancée après l'achat voit sa variation de LP comptée une 2e fois
            players.forEach(pl => {
                const ms = gamesOf(pl.id);
                const used = {};
                purchases.filter(x => x.kind === 'double' && x.buyerId === pl.id).sort((a, b) => a.createdAt - b.createdAt).forEach(d => {
                    const game = ms.find(g => startOf(g) >= d.createdAt && !used[g.matchId]);
                    if (!game) { statuses[d.id] = { state: 'pending' }; return; }
                    used[game.matchId] = true;
                    if (typeof game.lpChange === 'number') {
                        statuses[d.id] = { state: 'applied', win: !!game.win, lp: game.lpChange, matchDocId: game.id };
                        if (!d.test && d.createdAt >= resetAt[pl.id]) lpAdjust[pl.id].qod += game.lpChange;
                    } else {
                        statuses[d.id] = { state: 'toverify', win: !!game.win, matchDocId: game.id };
                    }
                });
            });

            // +10 LP pour soi / -10 LP à un adversaire (une fois dans tout le challenge)
            purchases.filter(x => x.kind === 'lpmove').forEach(m => {
                const affected = m.mode === 'gain' ? m.buyerId : m.targetId;
                const delta = m.mode === 'gain' ? LPMOVE_LP : -LPMOVE_LP;
                if (!m.test && lpAdjust[affected] && m.createdAt >= resetAt[affected]) lpAdjust[affected].moves += delta;
                statuses[m.id] = { state: 'applied' };
            });

            // Summoners inversés : on compare avec la partie précédente (Saut éclair passé de D à F ou inversement)
            purchases.filter(x => x.kind === 'spells').forEach(sp => {
                const ms = gamesOf(sp.targetId);
                const idx = ms.findIndex(g => startOf(g) >= sp.createdAt);
                if (idx === -1) { statuses[sp.id] = { state: 'pending' }; return; }
                const game = ms[idx], prev = ms[idx - 1];
                let check = 'unknown';
                if (prev) {
                    const a = (game.spells || []).indexOf(4), b = (prev.spells || []).indexOf(4);
                    if (a >= 0 && b >= 0) check = a !== b ? 'ok' : 'ko';
                }
                const played = (game.spells || []).map(id => SPELL_NAMES[id] || '?').join(' / ');
                statuses[sp.id] = { state: 'used', check, played, matchDocId: game.id };
            });

            findViolations(players, matches, purchases).forEach(v => {
                if (lpAdjust[v.offenderId] && v.createdAt >= resetAt[v.offenderId]) lpAdjust[v.offenderId].penalty -= VIOLATION_LP;
            });
            Object.values(lpAdjust).forEach(a => { a.total = a.qod + a.moves + a.penalty; });
            return { lpAdjust, statuses };
        };

        const describeStatus = (x, st) => {
            if (!st) return null;
            if (x.kind === 'ban') {
                if (st.state === 'pending') return { text: 'En attente de sa prochaine partie', tone: 'text-zinc-400' };
                return st.violated
                    ? { text: `⚠️ Non respecté : a joué ${st.played}${x.test ? '' : ` (−${VIOLATION_LP} LP)`}`, tone: 'text-red-400' }
                    : { text: `Respecté (a joué ${st.played})`, tone: 'text-emerald-400' };
            }
            if (x.kind === 'shield') {
                if (st.state === 'active') return { text: 'Actif : protège sa prochaine partie', tone: 'text-blue-400' };
                if (st.win) return { text: 'Gaspillé (partie gagnée)', tone: 'text-zinc-500' };
                return st.saved > 0
                    ? { text: `A sauvé ${st.saved} point${st.saved > 1 ? 's' : ''}`, tone: 'text-emerald-400' }
                    : { text: 'Utilisé (aucun point à protéger)', tone: 'text-zinc-500' };
            }
            if (x.kind === 'double') {
                if (st.state === 'pending') return { text: 'En attente de sa prochaine partie', tone: 'text-blue-400' };
                if (st.state === 'toverify') return { text: 'Partie jouée : variation de LP à valider par l\'organisateur', tone: 'text-amber-400' };
                if (st.lp === 0) return { text: 'Aucun LP gagné ni perdu : sans effet', tone: 'text-zinc-500' };
                return st.lp > 0
                    ? { text: `Gagné : +${st.lp} LP en plus (×2)`, tone: 'text-emerald-400' }
                    : { text: `Perdu : ${st.lp} LP en plus (×2)`, tone: 'text-red-400' };
            }
            if (x.kind === 'spells') {
                if (st.state === 'pending') return { text: 'En attente de sa prochaine partie', tone: 'text-zinc-400' };
                if (st.check === 'ok') return { text: `Respecté (sorts : ${st.played})`, tone: 'text-emerald-400' };
                if (st.check === 'ko') return { text: `⚠️ Non respecté (sorts : ${st.played})${x.test ? '' : ` (−${VIOLATION_LP} LP)`}`, tone: 'text-red-400' };
                return { text: `Partie jouée (sorts : ${st.played}), à vérifier`, tone: 'text-zinc-400' };
            }
            if (x.kind === 'lpmove') return { text: `${x.mode === 'gain' ? '+' : '−'}${LPMOVE_LP} LP appliqués`, tone: x.mode === 'gain' ? 'text-emerald-400' : 'text-red-400' };
            return null;
        };

        const ItemCard = ({ icon, title, price, desc, children, onBuy, disabled, busy, btnLabel }) => (
            <div className="rounded-xl border border-zinc-800 bg-zinc-950 p-4 flex flex-col gap-2">
                <div className="flex items-center gap-2 font-heading font-bold text-zinc-100">{icon} {title} <span className="ml-auto text-sm text-zinc-300">{price} pts</span></div>
                <p className="text-xs text-zinc-400">{desc}</p>
                {children}
                <button onClick={onBuy} disabled={busy || disabled} className="mt-1 w-full bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold py-2 rounded-xl text-sm disabled:opacity-40 disabled:cursor-not-allowed transition">{btnLabel}</button>
            </div>
        );

        const ShopView = ({ players, matches, purchases, effects, prices, onBuy, isAdmin, testMode, onCancel }) => {
            const version = useDdragonVersion();
            const [buyerId, setBuyerId] = useState(() => { try { return localStorage.getItem('shopBuyer') || ''; } catch { return ''; } });
            const [targetId, setTargetId] = useState('');
            const [champ, setChamp] = useState(null);
            const [search, setSearch] = useState('');
            const [champs, setChamps] = useState([]);
            const [showChamps, setShowChamps] = useState(false);
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState(null);

            useEffect(() => {
                let alive = true;
                fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/fr_FR/champion.json`)
                    .then(r => r.json())
                    .then(j => { if (alive) setChamps(Object.values(j.data).map(c => ({ id: c.id, name: c.name })).sort((a, b) => a.name.localeCompare(b.name, 'fr'))); })
                    .catch(() => {});
                return () => { alive = false; };
            }, [version]);

            const shop = useMemo(() => computeShop(players, matches, purchases), [players, matches, purchases]);
            const byPlayer = shop.byPlayer;
            const statuses = useMemo(() => ({ ...shop.statuses, ...effects.statuses }), [shop, effects]);
            const board = useMemo(() => [...players].sort((a, b) => (byPlayer[b.id]?.balance ?? 0) - (byPlayer[a.id]?.balance ?? 0)), [players, byPlayer]);
            const sortedPlayers = useMemo(() => [...players].sort((a, b) => (a.playerName || '').localeCompare(b.playerName || '')), [players]);

            const free = !!isAdmin && !!testMode; // mode test : points infinis, achats gratuits
            const buyer = players.find(p => p.id === buyerId);
            const target = players.find(p => p.id === targetId);
            const balance = buyer ? (byPlayer[buyer.id]?.balance ?? 0) : 0;
            const today = parisDay(Date.now());
            const slotUsed = (cat) => !free && !!buyer && purchases.some(x => !x.test && x.buyerId === buyer.id && categoryOf(x.kind, x.mode) === cat && parisDay(x.createdAt) === today);
            const bonusUsed = slotUsed('bonus'), malusUsed = slotUsed('malus');
            const lpmoveUsed = !free && !!buyer && purchases.some(x => !x.test && x.kind === 'lpmove' && x.buyerId === buyer.id);
            const bannedToday = useMemo(() => new Set(free ? [] : purchases.filter(x => !x.test && x.kind === 'ban' && x.targetId === targetId && parisDay(x.createdAt) === today).map(x => x.championKey)), [purchases, targetId, today, free]);
            const visibleChamps = champs.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));

            const chooseBuyer = (id) => {
                setBuyerId(id);
                if (id === targetId) { setTargetId(''); setChamp(null); }
                try { localStorage.setItem('shopBuyer', id); } catch {}
                setMsg(null);
            };

            const buy = async (kind, mode) => {
                const cat = categoryOf(kind, mode);
                const price = prices[kind];
                const fail = (text) => setMsg({ ok: false, text });
                if (!buyer) return fail('Choisis d\'abord qui tu es.');
                if (cat === 'malus' && !target) return fail('Choisis d\'abord le joueur ciblé.');
                if (kind === 'ban' && !champ) return fail('Choisis le champion à bannir.');
                if (kind === 'lpmove' && lpmoveUsed) return fail(`Tu as déjà utilisé ton coup de ${LPMOVE_LP} LP (une seule fois dans tout le challenge).`);
                if (slotUsed(cat)) return fail(`Tu as déjà acheté ton ${cat} aujourd'hui (1 ${cat} par jour).`);
                if (!free && balance < price) return fail(`Il te faut ${price} points (tu en as ${balance}).`);
                const label = {
                    shield: 'Acheter un bouclier',
                    double: 'Jouer quitte ou double sur ta prochaine partie',
                    ban: `Bannir ${champ?.name} pour ${target?.playerName}`,
                    spells: `Inverser les summoners de ${target?.playerName}`,
                    lpmove: mode === 'gain' ? `Gagner ${LPMOVE_LP} LP (usage unique dans tout le challenge)` : `Faire perdre ${LPMOVE_LP} LP à ${target?.playerName} (usage unique dans tout le challenge)`
                }[kind];
                if (!window.confirm(`${label} ? (${free ? 'mode test : gratuit' : price + ' points'})`)) return;
                setBusy(true); setMsg(null);
                try {
                    await onBuy({ buyer, kind, mode, target: cat === 'malus' ? target : null, champ: kind === 'ban' ? champ : null, price: free ? 0 : price, test: free });
                    if (kind === 'ban') { setChamp(null); setShowChamps(false); }
                    setMsg({ ok: true, text: 'Achat effectué !' + (['shield', 'double'].includes(kind) ? ' Lance ta partie après cet achat.' : '') });
                } catch (e) {
                    setMsg({ ok: false, text: e.message || 'Erreur pendant l\'achat.' });
                } finally {
                    setBusy(false);
                }
            };

            const cancel = async (x) => {
                if (!window.confirm(`Annuler l'achat de ${x.buyerName} (${purchaseLabel(x)}) ?\nLes points sont remboursés et il peut racheter son ${categoryOf(x.kind, x.mode)} du jour.`)) return;
                try { await onCancel(x, purchaseLabel(x)); setMsg({ ok: true, text: 'Achat annulé.' }); }
                catch (e) { setMsg({ ok: false, text: e.message || 'Impossible d\'annuler cet achat.' }); }
            };

            const feed = [...purchases].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 30);
            const feedTitle = (x) => {
                if (x.kind === 'ban') return <><b>{x.buyerName}</b> a banni <b>{x.championName}</b> pour <b>{x.targetName}</b></>;
                if (x.kind === 'shield') return <><b>{x.buyerName}</b> a acheté un bouclier</>;
                if (x.kind === 'double') return <><b>{x.buyerName}</b> joue quitte ou double</>;
                if (x.kind === 'spells') return <><b>{x.buyerName}</b> inverse les summoners de <b>{x.targetName}</b></>;
                if (x.kind === 'lpmove') return x.mode === 'gain' ? <><b>{x.buyerName}</b> s'offre +{LPMOVE_LP} LP</> : <><b>{x.buyerName}</b> fait perdre {LPMOVE_LP} LP à <b>{x.targetName}</b></>;
                return null;
            };
            const feedIcon = (x) => {
                if (x.kind === 'ban') return <img src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${x.championKey}.png`} alt="" className="w-9 h-9 rounded-lg border border-zinc-700" onError={e => { e.currentTarget.style.visibility = 'hidden'; }} />;
                const Icon = { shield: Shield, double: Dices, spells: ArrowLeftRight, lpmove: x.mode === 'gain' ? Zap : Skull }[x.kind] || ShoppingBag;
                const color = categoryOf(x.kind, x.mode) === 'bonus' ? 'text-blue-400' : 'text-red-400';
                return <div className="w-9 h-9 rounded-lg border border-zinc-700 bg-zinc-900 flex items-center justify-center"><Icon size={16} className={color} /></div>;
            };

            return (
                <div className="max-w-5xl mx-auto space-y-8">
                    <div>
                        <h2 className="text-2xl font-bold font-heading text-white flex items-center gap-2"><ShoppingBag className="text-zinc-400" /> Boutique à points</h2>
                        <p className="text-xs text-zinc-400 mt-0.5">+{POINTS.kill} point par kill · +{POINTS.win} par victoire · −1 toutes les {POINTS.deathsPerPenalty} morts. Les points se mettent à jour à chaque synchronisation.</p>
                    </div>

                    {/* Classement des points (public) */}
                    <div className="bg-zinc-900/60 rounded-2xl border border-zinc-800 overflow-hidden">
                        <div className="px-4 py-3 border-b border-zinc-800 font-heading font-bold text-sm uppercase tracking-wider text-zinc-300 flex items-center gap-2"><Coins size={15} /> Points des joueurs</div>
                        {board.length === 0 && <div className="py-10 text-center text-zinc-500 italic text-sm">Aucun joueur.</div>}
                        <div className="divide-y divide-zinc-800/60">
                            {board.map((pl, i) => {
                                const st = byPlayer[pl.id] || { kills: 0, wins: 0, penalty: 0, saved: 0, spent: 0, balance: 0, games: 0, activeShields: 0 };
                                return (
                                    <div key={pl.id} className="px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-1">
                                        <div className="w-6 text-center font-heading font-bold text-zinc-500">{i + 1}</div>
                                        <img src={pl.profileImg || DEFAULT_ICON} alt="" className="w-9 h-9 rounded-full object-cover border border-zinc-700" />
                                        <div className="min-w-[140px] flex-1">
                                            <div className="font-bold text-zinc-100 text-sm flex items-center gap-2 flex-wrap">{pl.playerName} <TeamTag team={pl.team} />
                                                {st.activeShields > 0 && <span className="inline-flex items-center gap-1 text-[10px] font-heading font-bold uppercase px-2 py-0.5 rounded-full border border-blue-500/40 bg-blue-500/10 text-blue-300"><Shield size={10} /> Bouclier</span>}
                                            </div>
                                            <div className="text-[11px] text-zinc-500">{st.games} partie{st.games > 1 ? 's' : ''} · {st.kills} kills · {st.wins} victoire{st.wins > 1 ? 's' : ''} · −{st.penalty} morts{st.saved > 0 ? ` (+${st.saved} sauvés)` : ''}{st.spent > 0 ? ` · ${st.spent} dépensés` : ''}</div>
                                        </div>
                                        <div className={`font-heading font-black text-2xl ${st.balance < 0 ? 'text-red-400' : 'text-white'}`}>{st.balance} <span className="text-xs font-semibold text-zinc-500">pts</span></div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Achats */}
                    <div className="bg-zinc-900 rounded-2xl border border-zinc-800 p-6 space-y-6">
                        {free && <div className="text-xs rounded-xl px-4 py-2.5 border border-amber-500/40 bg-amber-500/10 text-amber-200">Mode test activé : points infinis, achats gratuits et sans limite (marqués « TEST »). Les achats de test n'utilisent ni tes limites du jour ni les vrais bans, et ne modifient jamais les LP, ni de pénalité. Supprime-les avec la corbeille dans « Derniers achats ».</div>}
                        <div className="flex flex-col sm:flex-row sm:items-end gap-3 justify-between">
                            <label className="block text-xs text-zinc-400 flex-1 max-w-xs">Acheter en tant que
                                <select value={buyerId} onChange={e => chooseBuyer(e.target.value)} className="mt-1 w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white">
                                    <option value="">Choisis ton pseudo…</option>
                                    {sortedPlayers.map(p => <option key={p.id} value={p.id}>{p.playerName}</option>)}
                                </select>
                            </label>
                            {buyer && (
                                <div className="text-sm text-zinc-400 space-y-1 sm:text-right">
                                    <div>Ton solde : {free ? <span className="font-heading font-black text-xl text-amber-300">∞ pts</span> : <span className={`font-heading font-black text-xl ${balance < 0 ? 'text-red-400' : 'text-white'}`}>{balance} pts</span>}</div>
                                    <div className="text-xs">Aujourd'hui : bonus <b className={bonusUsed ? 'text-zinc-500' : 'text-emerald-400'}>{bonusUsed ? 'utilisé' : 'disponible'}</b> · malus <b className={malusUsed ? 'text-zinc-500' : 'text-emerald-400'}>{malusUsed ? 'utilisé' : 'disponible'}</b></div>
                                </div>
                            )}
                        </div>
                        <p className="text-xs text-zinc-500">Chaque joueur peut acheter <b className="text-zinc-300">1 bonus</b> et <b className="text-zinc-300">1 malus</b> par jour (remise à zéro à minuit, heure de Paris).</p>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* BONUS */}
                            <div className="space-y-3">
                                <div className="font-heading font-bold text-sm uppercase tracking-wider text-blue-300 flex items-center gap-2"><Shield size={14} /> Bonus · pour toi</div>
                                <ItemCard icon={<Shield size={16} className="text-blue-400" />} title="Bouclier" price={prices.shield} busy={busy} disabled={bonusUsed} btnLabel="Acheter le bouclier" onBuy={() => buy('shield')}
                                    desc={<>À acheter <b className="text-zinc-200">avant de lancer ta partie</b>. Si tu perds, les points perdus (morts) ne sont pas comptés. Si tu gagnes, il disparaît sans effet.</>} />
                                <ItemCard icon={<Dices size={16} className="text-blue-400" />} title="Quitte ou double" price={prices.double} busy={busy} disabled={bonusUsed} btnLabel="Jouer quitte ou double" onBuy={() => buy('double')}
                                    desc={<>À acheter <b className="text-zinc-200">avant ta partie</b>. Victoire : tu gagnes 2× les LP. Défaite : tu perds 2× les LP.</>} />
                                <ItemCard icon={<Zap size={16} className="text-blue-400" />} title={`Coup de pouce +${LPMOVE_LP} LP`} price={prices.lpmove} busy={busy} disabled={bonusUsed || lpmoveUsed} btnLabel={lpmoveUsed ? 'Déjà utilisé' : `Gagner ${LPMOVE_LP} LP`} onBuy={() => buy('lpmove', 'gain')}
                                    desc={<>Tu gagnes {LPMOVE_LP} LP directement. <b className="text-zinc-200">Une seule fois dans tout le challenge</b> (au choix avec le sabotage).</>} />
                            </div>

                            {/* MALUS */}
                            <div className="space-y-3">
                                <div className="font-heading font-bold text-sm uppercase tracking-wider text-red-300 flex items-center gap-2"><Skull size={14} /> Malus · sur un adversaire</div>
                                <select value={targetId} onChange={e => { setTargetId(e.target.value); setChamp(null); }} className="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white">
                                    <option value="">Joueur ciblé…</option>
                                    {sortedPlayers.filter(p => p.id !== buyerId).map(p => <option key={p.id} value={p.id}>{p.playerName}</option>)}
                                </select>

                                <ItemCard icon={<Ban size={16} className="text-red-400" />} title="Bannir un champion" price={prices.ban} busy={busy} disabled={malusUsed || !target || !champ} btnLabel={champ && target ? `Bannir ${champ.name} pour ${target.playerName}` : 'Bannir le champion'} onBuy={() => buy('ban')}
                                    desc="Interdit un champion à ce joueur pour sa prochaine partie. Un même champion ne peut être banni qu'une fois par jour pour un joueur.">
                                    {target && (
                                        <>
                                            <button onClick={() => setShowChamps(v => !v)} className="text-left text-xs text-zinc-300 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 hover:border-zinc-500 transition">{champ ? `Champion choisi : ${champ.name}` : 'Choisir un champion…'} <span className="text-zinc-500">{showChamps ? '▲' : '▼'}</span></button>
                                            {showChamps && (
                                                <>
                                                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Rechercher un champion…" className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500" />
                                                    <div className="max-h-52 overflow-y-auto grid grid-cols-5 sm:grid-cols-7 gap-1.5 pr-1">
                                                        {champs.length === 0 && <div className="col-span-full text-xs text-zinc-500 italic py-4 text-center">Chargement des champions…</div>}
                                                        {visibleChamps.map(c => {
                                                            const taken = bannedToday.has(c.id);
                                                            const sel = champ?.id === c.id;
                                                            return (
                                                                <button key={c.id} disabled={taken} onClick={() => { setChamp(c); setShowChamps(false); }} title={taken ? `${c.name} : déjà banni aujourd'hui pour ${target.playerName}` : c.name}
                                                                    className={`relative rounded-lg overflow-hidden border transition ${sel ? 'border-zinc-100 ring-2 ring-zinc-100' : 'border-zinc-800 hover:border-zinc-500'} ${taken ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                                                    <img src={`https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${c.id}.png`} alt={c.name} className="w-full aspect-square object-cover" loading="lazy" />
                                                                    {taken && <Ban size={16} className="absolute inset-0 m-auto text-red-400" />}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </>
                                            )}
                                        </>
                                    )}
                                </ItemCard>

                                <ItemCard icon={<ArrowLeftRight size={16} className="text-red-400" />} title="Summoners inversés" price={prices.spells} busy={busy} disabled={malusUsed || !target} btnLabel={target ? `Inverser ceux de ${target.playerName}` : 'Inverser les summoners'} onBuy={() => buy('spells')}
                                    desc="Le joueur ciblé doit jouer sa prochaine partie avec ses sorts d'invocateur inversés (par exemple Saut éclair sur D au lieu de F)." />
