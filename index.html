                                <ItemCard icon={<Skull size={16} className="text-red-400" />} title={`Sabotage −${LPMOVE_LP} LP`} price={prices.lpmove} busy={busy} disabled={malusUsed || lpmoveUsed || !target} btnLabel={lpmoveUsed ? 'Déjà utilisé' : (target ? `Retirer ${LPMOVE_LP} LP à ${target.playerName}` : `Retirer ${LPMOVE_LP} LP`)} onBuy={() => buy('lpmove', 'drain')}
                                    desc={<>Le joueur ciblé perd {LPMOVE_LP} LP directement. <b className="text-zinc-200">Une seule fois dans tout le challenge</b> (au choix avec le coup de pouce).</>} />
                            </div>
                        </div>

                        {msg && <div className={`text-sm rounded-xl px-4 py-2.5 border ${msg.ok ? 'text-emerald-300 border-emerald-500/30 bg-emerald-500/10' : 'text-red-300 border-red-500/30 bg-red-500/10'}`}>{msg.text}</div>}
                    </div>

                    {/* Activité */}
                    <div className="bg-zinc-900/60 rounded-2xl border border-zinc-800 overflow-hidden">
                        <div className="px-4 py-3 border-b border-zinc-800 font-heading font-bold text-sm uppercase tracking-wider text-zinc-300">Derniers achats</div>
                        {feed.length === 0 && <div className="py-10 text-center text-zinc-500 italic text-sm">Aucun achat pour l'instant.</div>}
                        <div className="divide-y divide-zinc-800/60">
                            {feed.map(x => {
                                const d = describeStatus(x, statuses[x.id]);
                                return (
                                    <div key={x.id} className="px-4 py-3 flex items-center gap-3">
                                        {feedIcon(x)}
                                        <div className="flex-1 min-w-0">
                                            <div className="text-sm text-zinc-200">{feedTitle(x)}</div>
                                            {d && <div className={`text-xs ${d.tone}`}>{d.text}</div>}
                                        </div>
                                        <div className="text-right shrink-0">
                                            <div className="text-xs font-bold text-zinc-300">{x.test ? <span className="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30">TEST</span> : `−${x.price} pts`}</div>
                                            <div className="text-[11px] text-zinc-500">{formatDate(x.createdAt)}</div>
                                        </div>
                                        {isAdmin && (
                                            <button onClick={() => cancel(x)} title="Annuler cet achat" className="p-2 text-zinc-500 hover:text-red-400 transition shrink-0"><Trash2 size={16} /></button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const PlayerEditModal = ({ player, onClose, onSave }) => {
            const [form, setForm] = useState({
                playerName: player.playerName || '',
                riotId: player.riotId || '',
                twitchUrl: player.twitchUrl || '',
                team: player.team || ''
            });

        const AdminPanel = ({ testMode, onToggleTestMode, players, matches, config, onUpdateConfig, pendingDoubles, onSetMatchLp, onAddPlayer, onUpdatePlayer, onSaveMatch, onRequestEdit, onRequestReset, onResetShop }) => {
            const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem('riotApiKey') || ''; } catch { return ''; } });
            const [status, setStatus] = useState('');
            const [loading, setLoading] = useState(false);
            const [playerForm, setPlayerForm] = useState({ playerName: '', riotId: '', twitchUrl: '', team: '' });

            // Appel Riot via le proxy Vercel, avec nouvelle tentative si la limite de requêtes est atteinte
            const riot = async (params) => {
                for (let attempt = 0; attempt < 4; attempt++) {
                    const r = await fetch(`/api/riot?${new URLSearchParams({ ...params, apiKey: apiKey.trim() })}`);
                    if (r.status === 429) {
                        setStatus('⏳ Limite de requêtes Riot atteinte, nouvelle tentative dans 15 s...');
                        await new Promise(res => setTimeout(res, 15000));
                        continue;
                    }
                    const data = await r.json();
                    if (!r.ok) throw new Error(data?.status?.message || data?.error || `Erreur Riot (${r.status})`);
                    return data;
                }
                throw new Error('Limite de requêtes Riot atteinte, réessaie dans 2 minutes');
            };

            const syncingRef = useRef(false);
            const handleSync = async () => {
                if (!apiKey.trim()) return setStatus("❌ Clé API Riot requise.");
                if (syncingRef.current) return;
                syncingRef.current = true;
                setLoading(true);
                setStatus("⏳ Synchronisation des invocateurs via le proxy Vercel...");
                let success = 0, newGames = 0, errors = [];

                for (const p of players) {
                    try {
                        const syncStart = Math.floor(Date.now() / 1000);
                        const [gameName, tagLine] = p.riotId.split('#');
                        const accData = await riot({ type: 'account', gameName: gameName.trim(), tagLine: tagLine.trim() });
                        const sumData = await riot({ type: 'summoner', value: accData.puuid });
                        const legData = await riot({ type: 'league', value: accData.puuid });

                        const soloQ = Array.isArray(legData) ? legData.find(q => q.queueType === 'RANKED_SOLO_5x5') : null;
                        let rankStr = 'Unranked', rankLabel = 'Unranked', wins = 0, losses = 0, currentAbsLP = 0;
                        const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${sumData.profileIconId}.jpg`;

                        if (soloQ) {
                            rankStr = soloQ.tier.charAt(0).toUpperCase() + soloQ.tier.slice(1).toLowerCase();
                            const isApex = ['MASTER', 'GRANDMASTER', 'CHALLENGER'].includes(soloQ.tier.toUpperCase());
                            rankLabel = `${rankStr}${isApex ? '' : ' ' + soloQ.rank} · ${soloQ.leaguePoints} LP`;
                            wins = soloQ.wins;
                            losses = soloQ.losses;
                            currentAbsLP = calculateAbsoluteLP(soloQ.tier, soloQ.rank, soloQ.leaguePoints);
                        }

                        let startLP = p.startAbsoluteLP ?? currentAbsLP;
                        const newDelta = currentAbsLP - startLP;

                        // Historique des parties classées solo/duo (Match-v5)
                        const hasPrevious = p.currentAbsoluteLP !== undefined && p.currentAbsoluteLP !== null;
                        try {
                            const ids = await riot({
                                type: 'matchids', value: accData.puuid, queue: '420', count: '20',
                                ...(p.historySince ? { startTime: String(p.historySince) } : {})
                            });
                            const known = new Set(matches.filter(m => m.playerId === p.id).map(m => m.matchId));
                            const fresh = (Array.isArray(ids) ? ids : []).filter(id => !known.has(id));
                            // Un seul nouveau match depuis la dernière synchro : on peut lui attribuer la variation de LP
                            const lpIfOne = (fresh.length === 1 && hasPrevious) ? currentAbsLP - p.currentAbsoluteLP : null;

                            for (const matchId of [...fresh].reverse()) {
                                const m = await riot({ type: 'match', value: matchId });
                                const info = m.info;
                                const me = info.participants.find(x => x.puuid === accData.puuid);
                                if (!me) continue;
                                await onSaveMatch(`${matchId}_${p.id}`, {
                                    type: 'match',
                                    matchId,
                                    playerId: p.id,
                                    playerName: p.playerName,
                                    team: p.team || '',
                                    gameCreation: info.gameCreation || null,
                                    timestamp: info.gameEndTimestamp || (info.gameCreation + (info.gameDuration || 0) * 1000),
                                    duration: info.gameDuration || 0,
                                    queueId: info.queueId,
                                    win: !!me.win,
                                    teamId: me.teamId,
                                    championName: me.championName,
                                    champLevel: me.champLevel,
                                    kills: me.kills, deaths: me.deaths, assists: me.assists,
                                    cs: (me.totalMinionsKilled || 0) + (me.neutralMinionsKilled || 0),
                                    vision: me.visionScore || 0,
                                    multiKill: me.largestMultiKill || 0,
                                    items: [0, 1, 2, 3, 4, 5, 6].map(i => me['item' + i] || 0),
                                    spells: [me.summoner1Id, me.summoner2Id],
                                    lpChange: lpIfOne,
                                    participants: info.participants.map(x => ({
                                        n: x.riotIdGameName || x.summonerName || '?',
                                        c: x.championName,
                                        t: x.teamId,
                                        me: x.puuid === accData.puuid
                                    }))
                                });
                                newGames++;
                            }
                        } catch (matchErr) {
                            errors.push(`${p.playerName} (parties) : ${matchErr.message}`);
                        }

                        await onUpdatePlayer(p.id, {
                            rank: rankStr,
                            rankLabel,
                            wins,
                            losses,
                            profileImg: iconUrl,
                            startAbsoluteLP: startLP,
                            currentAbsoluteLP: currentAbsLP,
                            lpDelta: newDelta,
                            historySince: Math.max(p.historySince || 0, syncStart - 7200)
                        });
                        success++;
                        await new Promise(r => setTimeout(r, 200));
                    } catch (err) {
                        errors.push(`${p.playerName} : ${err.message}`);
                    }
                }
                const hhmm = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                syncingRef.current = false;
                setStatus(errors.length ? `[${hhmm}] ⚠️ ${success} mis à jour, ${newGames} nouvelle(s) partie(s), erreurs :\n${errors.join('\n')}` : `[${hhmm}] ✅ ${success} joueur(s) synchronisés, ${newGames} nouvelle(s) partie(s) enregistrée(s).`);

            const toggleAuto = (v) => { setAutoSync(v); try { localStorage.setItem('autoSync', v ? '1' : '0'); } catch {} };
            const syncRef = useRef(handleSync);
            syncRef.current = handleSync;
            useEffect(() => {
                if (!autoSync || !apiKey.trim()) return;
                const id = setInterval(() => syncRef.current(), 30 * 60 * 1000);
                return () => clearInterval(id);
            }, [autoSync, apiKey]);

            const submitPlayer = async (e) => {
                e.preventDefault();
                await onAddPlayer({ ...playerForm, rank: 'Unranked', lpDelta: 0, wins: 0, losses: 0 });
                setPlayerForm({ playerName: '', riotId: '', twitchUrl: '', team: '' });

            const sortedPlayers = [...players].sort((a, b) => (a.playerName || '').localeCompare(b.playerName || ''));

            return (
                <div className="max-w-3xl mx-auto space-y-8">
                    <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-3">
                            <Settings className="text-zinc-400" /> Paramètres
                        </h3>
                        <label className="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" checked={!!testMode} onChange={e => onToggleTestMode(e.target.checked)} className="mt-1 w-4 h-4 accent-amber-400" />
                            <span className="text-sm text-zinc-200">Mode admin / test : points infinis dans la boutique
                                <span className="block text-xs text-zinc-500 mt-0.5">Tes achats sont gratuits, sans limite, et marqués « TEST ». Ils ne modifient jamais les LP et ne comptent pas dans les limites des vrais achats. Réglage propre à ce navigateur, actif seulement quand tu es connecté en organisateur.</span>
                            </span>
                        </label>
                    </div>

                    <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-4">
                            <Settings className="text-zinc-400" /> Riot API Tracker
                        </h3>

                                type="password" 
                                placeholder="RGAPI-XXXXXXXX-XXXX-..."

                                onChange={e => { setApiKey(e.target.value); try { localStorage.setItem('riotApiKey', e.target.value); } catch {} }}
                                className="flex-1 bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-white"
                            />
                            <button 
                                onClick={handleSync} 
                                disabled={loading}
                                className="bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold px-6 py-2.5 rounded-xl transition disabled:opacity-50"
                            >
                                {loading ? 'Sync...' : 'Synchroniser'}
                            </button>
                        </div>
                        <label className="flex items-start gap-3 cursor-pointer mb-4">
                            <input type="checkbox" checked={autoSync} onChange={e => toggleAuto(e.target.checked)} className="mt-1 w-4 h-4 accent-emerald-400" />
                            <span className="text-sm text-zinc-200">Synchronisation automatique toutes les 30 minutes
                                <span className="block text-xs text-zinc-500 mt-0.5">Fonctionne tant que cette page reste ouverte dans ton navigateur (connecté en organisateur, clé Riot saisie). Si tu fermes l'onglet ou si l'ordi se met en veille, elle s'arrête.</span>
                            </span>
                        </label>
                        {status && <pre className="p-3 bg-black/40 rounded-lg text-xs font-mono text-zinc-300 whitespace-pre-wrap">{status}</pre>}
                    </div>

                    <form onSubmit={submitPlayer} className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-4">
                            <UserPlus className="text-emerald-400" /> Inscrire un compétiteur
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">

                                required 
                                placeholder="Pseudo streamer" 
                                value={playerForm.playerName}

                            <input 
                                required 
                                placeholder="Riot ID (Nom#TAG)" 
                                value={playerForm.riotId}
                                onChange={e => setPlayerForm({...playerForm, riotId: e.target.value})}

                                placeholder="URL Twitch (optionnel)" 
                                value={playerForm.twitchUrl}
                                onChange={e => setPlayerForm({...playerForm, twitchUrl: e.target.value})}

                        <button type="submit" className="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold py-2.5 rounded-xl transition">

                        </button>
                    </form>

                    <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-4">
                            <Users className="text-zinc-400" /> Gérer les joueurs ({players.length})
                        </h3>
                        {sortedPlayers.length === 0 && <p className="text-sm text-zinc-500 italic">Aucun joueur inscrit.</p>}
                        <div className="divide-y divide-zinc-800/70">
                            {sortedPlayers.map(p => (
                                <div key={p.id} className="flex items-center gap-3 py-2.5">
                                    <img src={p.profileImg || DEFAULT_ICON} alt="" className="w-9 h-9 rounded-full object-cover border border-zinc-700" />
                                    <div className="flex-1 min-w-0">
                                        <div className="font-bold text-zinc-100 text-sm flex items-center gap-2 flex-wrap">{p.playerName} <TeamTag team={p.team} /></div>
                                        <div className="text-xs font-mono text-zinc-500 truncate">{p.riotId}</div>
                                    </div>
                                    <div className={`font-heading font-bold text-sm ${(p.lpDelta || 0) >= 0 ? 'text-zinc-100' : 'text-red-400'}`}>{formatLP(p.lpDelta)} LP</div>
                                    <button onClick={() => onRequestEdit(p)} className="flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-heading font-bold uppercase px-3 py-1.5 rounded-lg transition">
                                        <Edit2 size={13} /> Modifier
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    <PricesEditor config={config} onUpdateConfig={onUpdateConfig} />
                    <DoubleValidator items={pendingDoubles || []} onSetMatchLp={onSetMatchLp} />

                    <ShopReset players={players} onResetShop={onResetShop} />

                    <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
                        <h3 className="font-heading text-xl font-bold text-white flex items-center gap-2 mb-2">
                            <RotateCcw className="text-zinc-400" /> Réinitialiser les compteurs LP
                        </h3>
                        <p className="text-xs text-zinc-400 mb-4">Remet la progression de tous les joueurs (et donc des équipes) à 0 LP. Le rang actuel de chacun devient le nouveau point de départ.</p>
                        <button onClick={onRequestReset} className="w-full bg-red-600/90 hover:bg-red-500 text-white font-heading font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                            <RotateCcw size={16} /> Réinitialiser
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [tab, setTab] = useState('classement');
            const [players, setPlayers] = useState([]);
            const [config, setConfig] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwd, setPwd] = useState('');
            const [toDelete, setToDelete] = useState(null);
            const [toEdit, setToEdit] = useState(null);
            const [history, setHistory] = useState([]);
            const [purchases, setPurchases] = useState([]);
            const [testMode, setTestMode] = useState(() => { try { return localStorage.getItem('shopTestMode') === '1'; } catch { return false; } });
            const toggleTestMode = (v) => { setTestMode(v); try { localStorage.setItem('shopTestMode', v ? '1' : '0'); } catch {} };
            const [showReset, setShowReset] = useState(false);
            const [clearHistory, setClearHistory] = useState(false);
            const [resetting, setResetting] = useState(false);

            useEffect(() => {
                if (!auth) return;
                signInAnonymously(auth).catch(err => console.error(err));
                onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const unsubP = onSnapshot(collection(db, 'players'), snap => {
                    setPlayers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubC = onSnapshot(doc(db, 'config', 'main'), snap => {
                    if (snap.exists()) setConfig(snap.data());
                });
                const unsubH = onSnapshot(
                    query(collection(db, 'history'), orderBy('timestamp', 'desc'), limit(500)),
                    snap => setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error('Historique :', err)
                );
                const unsubS = onSnapshot(
                    query(collection(db, 'history'), where('type', '==', 'purchase')),
                    snap => setPurchases(snap.docs.map(d => {
                        const data = d.data({ serverTimestamps: 'estimate' });
                        const toMs = v => (v && typeof v.toMillis === 'function') ? v.toMillis() : v;
                        return { id: d.id, ...data, createdAt: toMs(data.createdAt) };
                    })),
                    err => console.error('Boutique :', err)
                );
                return () => { unsubP(); unsubC(); unsubH(); unsubS(); };
            }, [user]);

            // Alerte Discord (via /api/discord) : ne bloque jamais l'achat si elle échoue
            const notifyDiscord = (payload) => {
                const send = (retry) => fetch('/api/discord', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true
                }).then(r => { if (!r.ok && retry) setTimeout(() => send(false), 2000); }).catch(() => { if (retry) setTimeout(() => send(false), 2000); });
                try { send(true); } catch {}
            };

            // Alerte Discord unique par infraction : un marqueur dans Firestore (créé en transaction) évite les doublons entre navigateurs
            const notifiedRef = useRef(new Set());
            useEffect(() => {
                if (!user || !db) return;
                findViolations(players, history.filter(h => h.type === 'match'), purchases).forEach(v => {
                    if (notifiedRef.current.has(v.id)) return;
                    notifiedRef.current.add(v.id);
                    const ref = doc(db, 'history', `violation_${v.id}`);
                    runTransaction(db, async tx => {
                        const snap = await tx.get(ref);
                        if (snap.exists()) return false;
                        tx.set(ref, { type: 'violation', purchaseId: v.id, playerId: v.offenderId, timestamp: Date.now() });
                        return true;
                    }).then(created => {
                        if (created) notifyDiscord({ kind: 'violation', buyerName: v.offenderName, targetName: v.buyerName, label: v.what, mode: v.kind, price: VIOLATION_LP });
                    }).catch(() => notifiedRef.current.delete(v.id));
                });
            }, [user, players, history, purchases]);

            const crud = {
                add: async data => addDoc(collection(db, 'players'), data),
                update: async (id, data) => updateDoc(doc(db, 'players', id), data),
                del: async id => deleteDoc(doc(db, 'players', id)),
                updateConfig: async data => setDoc(doc(db, 'config', 'main'), data, { merge: true }),
                saveMatch: async (id, data) => setDoc(doc(db, 'history', id), data),
                updateHistoryDoc: async (id, data) => updateDoc(doc(db, 'history', id), data),
                // Annulation d'un achat (admin) : supprime l'achat ET son marqueur « 1 bonus / 1 malus par jour »
                // -> points remboursés, effet supprimé, le joueur peut racheter ; un ban/coup de LP redevient disponible
                cancelPurchase: async (x, label) => {
                    const b = writeBatch(db);
                    b.delete(doc(db, 'history', x.id));
                    if (!x.test) b.delete(doc(db, 'history', limitDocId(x))); // un achat de test n'a pas de marqueur
                    await b.commit();
                    notifyDiscord({ kind: 'cancel', buyerName: x.buyerName, label, price: x.price || 0, test: !!x.test });
                },
                // Achat unique, vérifié dans une transaction :
                //  - 1 bonus et 1 malus par jour et par joueur (document « limit »)
                //  - un même champion ne se banne qu'une fois par jour pour un joueur
                //  - le coup de pouce / sabotage de LP ne s'achète qu'une fois dans tout le challenge
                buyItem: async ({ buyer, kind, mode, target, champ, price, test }) => {
                    const now = Date.now();
                    const day = parisDay(now);
                    const category = categoryOf(kind, mode);
                    const limitRef = doc(db, 'history', limitDocId({ buyerId: buyer.id, day, category }));
                    const purchaseRef = test ? doc(collection(db, 'history')) : kind === 'ban' ? doc(db, 'history', `ban_${target.id}_${champ.id}_${day}`)
                        : kind === 'lpmove' ? doc(db, 'history', `lpmove_${buyer.id}`)
                        : doc(collection(db, 'history'));
                    const data = { type: 'purchase', kind, buyerId: buyer.id, buyerName: buyer.playerName, price, category, day, createdAt: serverTimestamp(), timestamp: now };
                    if (mode) data.mode = mode;
                    if (test) data.test = true;
                    if (target) { data.targetId = target.id; data.targetName = target.playerName; }
                    if (champ) { data.championKey = champ.id; data.championName = champ.name; }

                    if (test) {
                        // Mode test : aucune limite (ni jour, ni unicité) et aucun marqueur, donc rien n'est consommé pour de vrai
                        await setDoc(purchaseRef, data);
                    } else await runTransaction(db, async tx => {
                        const limitSnap = await tx.get(limitRef);
                        const purchaseSnap = await tx.get(purchaseRef);
                        if (limitSnap.exists()) throw new Error(`Tu as déjà acheté ton ${category} aujourd'hui (1 ${category} par jour).`);
                        if (purchaseSnap.exists()) {
                            throw new Error(kind === 'ban'
                                ? `${champ.name} est déjà banni aujourd'hui pour ${target.playerName}.`
                                : `Tu as déjà utilisé ton coup de ${LPMOVE_LP} LP (une seule fois dans tout le challenge).`);
                        }
                        tx.set(limitRef, { type: 'limit', buyerId: buyer.id, day, category, timestamp: now });
                        tx.set(purchaseRef, data);
                    });
                    notifyDiscord({ kind, mode, buyerName: buyer.playerName, targetName: target?.playerName, championName: champ?.name, price, test: !!test });
                }
            };

            const resetShopPoints = async (playerId) => {
                const batch = writeBatch(db);
                const now = Date.now();
                players.filter(p => !playerId || p.id === playerId).forEach(p => batch.update(doc(db, 'players', p.id), { shopResetAt: now }));
                await batch.commit();
            };

            // Remet tous les compteurs LP à 0 : le LP actuel devient le nouveau point de départ
            const resetLP = async () => {
                setResetting(true);
                try {
                    const batch = writeBatch(db);
                    players.forEach(p => {
                        batch.update(doc(db, 'players', p.id), {
                            startAbsoluteLP: p.currentAbsoluteLP ?? null,
                            lpDelta: 0,
                            lpResetAt: Date.now(),
                            historySince: Math.floor(Date.now() / 1000)
                        });
                    });
                    await batch.commit();

                    if (clearHistory) {
                        const snap = await getDocs(collection(db, 'history'));
                        for (let i = 0; i < snap.docs.length; i += 400) {
                            const b = writeBatch(db);
                            snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
                            await b.commit();
                        }
                    }
                    setShowReset(false);
                    setClearHistory(false);
                } catch (e) {
                    console.error(e);
                    alert('Erreur pendant la réinitialisation : ' + e.message);
                } finally {
                    setResetting(false);
                }
            };

            const matchList = useMemo(() => history.filter(h => h.type === 'match'), [history]);
            const effects = useMemo(() => computeEffects(players, matchList, purchases), [players, matchList, purchases]);
            // Les LP affichés = LP Riot + effets de la boutique (quitte ou double, coup de pouce / sabotage)
            const playersView = useMemo(() => players.map(p => {
                const adj = effects.lpAdjust[p.id]?.total || 0;
                return { ...p, lpAdjust: adj, lpDelta: (p.lpDelta || 0) + adj };
            }), [players, effects]);
            const allStatuses = useMemo(() => ({ ...computeShop(players, matchList, purchases).statuses, ...effects.statuses }), [players, matchList, purchases, effects]);
            const prices = useMemo(() => ({ ...DEFAULT_PRICES, ...(config?.prices || {}) }), [config]);
            const pendingDoubles = useMemo(() => purchases
                .filter(x => x.kind === 'double' && effects.statuses[x.id]?.state === 'toverify')
                .map(x => ({ ...x, matchDocId: effects.statuses[x.id].matchDocId, win: effects.statuses[x.id].win })), [purchases, effects]);

            const stats = useMemo(() => {
                const totalGames = players.reduce((acc, p) => acc + (p.wins || 0) + (p.losses || 0), 0);
                return { totalGames, count: players.length };
            }, [players]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header soloqchallenge.fr style */}
                    <header className="border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-lg bg-zinc-100 flex items-center justify-center font-heading font-black text-zinc-900 text-lg">
                                        SQ
                                    </div>
                                    <span className="font-heading font-black text-2xl tracking-wider text-zinc-100">
                                        SOLOQ CHALLENGE
                                    </span>
                                </div>
                                <div className="hidden lg:flex items-center gap-4 text-xs font-heading uppercase text-zinc-400 pl-6 border-l border-zinc-800">
                                    <div>Participants : <span className="text-white font-bold">{stats.count}</span></div>
                                    <div>Parties jouées : <span className="text-zinc-400 font-bold">{stats.totalGames}</span></div>
                                </div>
                            </div>

                            <nav className="flex flex-wrap items-center gap-1.5 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                                <button onClick={() => setTab('classement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'classement' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Classement</button>
                                <button onClick={() => setTab('joueurs')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'joueurs' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Joueurs</button>
                                <button onClick={() => setTab('historique')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'historique' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Historique</button>
                                <button onClick={() => setTab('boutique')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'boutique' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Boutique</button>
                                <button onClick={() => setTab('reglement')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'reglement' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Règles</button>
                                {isAdmin && <button onClick={() => setTab('admin')} className={`px-4 py-1.5 rounded-lg text-xs font-heading font-bold uppercase transition ${tab === 'admin' ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Admin</button>}
                                
                                <div className="w-px h-4 bg-zinc-700 mx-1"></div>
                                {isAdmin ? (
                                    <button onClick={() => setIsAdmin(false)} className="px-2 py-1 text-red-400 text-xs font-heading font-bold">Quitter</button>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="p-1.5 text-zinc-500 hover:text-white transition"><Lock size={14}/></button>
                                )}
                            </nav>
                        </div>
                    </header>

                    {/* Main content */}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
                        {tab === 'classement' && <Leaderboard players={playersView} isAdmin={isAdmin} onRequestDelete={setToDelete} onRequestEdit={setToEdit} />}
                        {tab === 'joueurs' && <PlayersList players={playersView} />}
                        {tab === 'historique' && <HistoryView history={history} players={playersView} purchases={purchases} statuses={allStatuses} />}
                        {tab === 'boutique' && <ShopView players={playersView} matches={matchList} purchases={purchases} effects={effects} prices={prices} onBuy={crud.buyItem} isAdmin={isAdmin} testMode={testMode} onCancel={crud.cancelPurchase} />}
                        {tab === 'reglement' && <RulesView config={config} />}
                        {isAdmin && (
                          <div className={tab === 'admin' ? '' : 'hidden'}>
                            <AdminPanel
                                players={players}
                                onAddPlayer={crud.add}
                                onUpdatePlayer={crud.update}
                                matches={matchList}
                                onSaveMatch={crud.saveMatch}
                                config={config}
                                onUpdateConfig={crud.updateConfig}
                                pendingDoubles={pendingDoubles}
                                testMode={testMode}
                                onToggleTestMode={toggleTestMode}
                                onSetMatchLp={(id, lp) => crud.updateHistoryDoc(id, { lpChange: lp })}
                                onRequestEdit={setToEdit}
                                onRequestReset={() => setShowReset(true)}
                                onResetShop={resetShopPoints}
                            />
                          </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-zinc-800/80 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
                        SoloQ Challenge — Plateforme non affiliée à Riot Games. Données synchronisées via l'API Riot Games.
                    </footer>

                    {/* Admin Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 shadow-2xl">
                                <div className="flex justify-between mb-4">
                                    <h3 className="font-heading font-bold text-lg text-white">Accès Organisateur</h3>
                                    <button onClick={() => setShowLogin(false)} className="text-zinc-400"><X size={18}/></button>
                                </div>
                                <input 
                                    type="password" 
                                    value={pwd} 
                                    onChange={e => setPwd(e.target.value)} 
                                    placeholder="Mot de passe admin" 
                                    className="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 mb-4 text-white text-sm"
                                />
                                <button 
                                    onClick={() => { if (pwd === 'Hussein180690') { setIsAdmin(true); setShowLogin(false); setPwd(''); } }} 
                                    className="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-heading font-bold py-2.5 rounded-xl transition"
                                >
                                    Déverrouiller
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {toEdit && isAdmin && (
                        <PlayerEditModal player={toEdit} onClose={() => setToEdit(null)} onSave={crud.update} />
                    )}

                    {/* Reset Modal */}
                    {showReset && isAdmin && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 text-center">
                                <RotateCcw className="mx-auto text-zinc-400 mb-2" size={28} />
                                <h3 className="font-heading font-bold text-lg text-white mb-2">Réinitialiser les compteurs LP ?</h3>
                                <p className="text-xs text-zinc-400 mb-4">Tous les joueurs et les deux équipes repartent à 0 LP à partir de leur rang actuel.</p>
                                <label className="flex items-center justify-center gap-2 text-xs text-zinc-300 mb-6 cursor-pointer">
                                    <input type="checkbox" checked={clearHistory} onChange={e => setClearHistory(e.target.checked)} className="accent-red-500" />
                                    Vider aussi l'historique et la boutique
                                </label>
                                <div className="flex gap-3">
                                    <button onClick={() => { setShowReset(false); setClearHistory(false); }} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-heading font-bold py-2 rounded-xl text-sm">Annuler</button>
                                    <button onClick={resetLP} disabled={resetting} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-heading font-bold py-2 rounded-xl text-sm disabled:opacity-50">{resetting ? 'En cours...' : 'Réinitialiser'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Delete Modal */}
                    {toDelete && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 p-6 rounded-2xl w-full max-w-sm border border-zinc-700 text-center">
                                <h3 className="font-heading font-bold text-lg text-white mb-2">Retirer {toDelete.playerName} ?</h3>
                                <p className="text-xs text-zinc-400 mb-6">Cette action est définitive et supprimera ses stats du classement.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setToDelete(null)} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-heading font-bold py-2 rounded-xl text-sm">Annuler</button>
                                    <button onClick={() => { crud.del(toDelete.id); setToDelete(null); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-heading font-bold py-2 rounded-xl text-sm">Supprimer</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
